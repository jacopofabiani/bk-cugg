<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Albo - Bobby Kelzor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #fff;
      color: #000;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #555;
      font-size: 0.9rem;
      margin-bottom: 28px;
    }

    h2 {
      font-size: 1.15rem;
      margin: 32px 0 14px;
    }

    /* --- Titles / runner-ups summary --- */
    .titles {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      max-width: 900px;
    }

    .title-card {
      background: #fff;
      border: 1.5px solid #000;
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 150px;
    }

    .title-count {
      font-size: 1.5rem;
      font-weight: bold;
      line-height: 1;
    }

    .title-deck {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .title-name { font-weight: bold; font-size: 0.95rem; }
    .title-sub {
      font-size: 0.8rem;
      color: #555;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .title-stars { font-size: 0.8rem; color: #555; letter-spacing: 1px; }

    .colors {
      display: inline-flex;
      gap: 3px;
      align-items: center;
    }

    .color-pip {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 1px solid #000;
    }

    .color-W { background: #f9fafb; }
    .color-U { background: #3b82f6; }
    .color-B { background: #1f2937; }
    .color-R { background: #ef4444; }
    .color-G { background: #22c55e; }
    .color-C { background: #9ca3af; }

    .section-note {
      color: #555;
      font-size: 0.85rem;
      margin: -6px 0 14px;
      max-width: 620px;
    }

    #error { color: red; margin-top: 20px; }
  </style>
  <script src="nav.js?v=2" defer></script>
</head>
<body>

<site-nav></site-nav>

<div id="content">
  <p style="color:#888">Loading...</p>
</div>
<p id="error"></p>

<script>
  function colorsHtml(deckName, decksByName) {
    const deck = decksByName[deckName];
    if (!deck) return '';
    return `<span class="colors">${deck.colors.map(c => `<span class="color-pip color-${c}"></span>`).join('')}</span>`;
  }

  function countCardsHtml(counts, decksByName, medal) {
    const ranked = Object.entries(counts).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));

    return `
      <div class="titles">
        ${ranked.map(([deck, count]) => `
          <div class="title-card">
            <div class="title-count">${count}</div>
            <div class="title-deck">
              <div class="title-name">${deck} ${colorsHtml(deck, decksByName)}</div>
              <div class="title-stars">${medal.repeat(count)}</div>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }

  function titlesHtml(tournaments, decksByName) {
    const counts = {};
    for (const t of tournaments) counts[t.winner] = (counts[t.winner] || 0) + 1;
    return countCardsHtml(counts, decksByName, '🏆');
  }

  // A multi-series edition crowns more than one winner, but only Serie A's
  // counts as a Bob Kelzor title -- so Titles above ignores the lower series
  // entirely and each one gets its own roll of honour below.
  function lowerSerieHtml(tournaments, decksByName, key, label) {
    const eds = tournaments.filter(t => t[key]);
    if (!eds.length) return '';

    const counts = {};
    for (const t of eds) counts[t[key].winner] = (counts[t[key].winner] || 0) + 1;

    return `
      <h2>${label}</h2>
      <p class="section-note">Winners of the ${label} bracket in multi-series editions.
        These do not count towards the titles at the top of the page.</p>
      ${countCardsHtml(counts, decksByName, '\u{1f3c5}')}
    `;
  }

  // MVPs are counted per card, not per deck: the MVP has always come from the
  // winning deck, so a per-deck tally would just restate Titles.
  function mvpCardsHtml(mvps, decksByName) {
    const byCard = {};
    for (const m of mvps) {
      const a = byCard[m.card] ||= { card: m.card, decks: new Set(), n: 0 };
      a.decks.add(m.deck);
      a.n++;
    }
    const ranked = Object.values(byCard).sort((a, b) => b.n - a.n || a.card.localeCompare(b.card));

    return `
      <div class="titles">
        ${ranked.map(a => `
          <div class="title-card">
            <div class="title-count">${a.n}</div>
            <div class="title-deck">
              <div class="title-name">${a.card}</div>
              <div class="title-sub">${[...a.decks].map(d =>
                `${d} ${colorsHtml(d, decksByName)}`).join(' · ')}</div>
              <div class="title-stars">${'\u2b50'.repeat(a.n)}</div>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }

  // Scarpa d'Oro is tallied per card like the MVP, and only from the XXI
  // edition on -- earlier entries carry a null, so the section stays hidden
  // until there is something to show.
  function scarpaCardsHtml(mvps, decksByName) {
    const awarded = mvps.filter(m => m.scarpa);
    if (!awarded.length) return '';

    const byCard = {};
    for (const m of awarded) {
      const a = byCard[m.scarpa.card] ||= { card: m.scarpa.card, decks: new Set(), n: 0 };
      a.decks.add(m.scarpa.deck);
      a.n++;
    }
    const ranked = Object.values(byCard).sort((a, b) => b.n - a.n || a.card.localeCompare(b.card));

    return `
      <h2>Scarpa d'Oro</h2>
      <div class="titles">
        ${ranked.map(a => `
          <div class="title-card">
            <div class="title-count">${a.n}</div>
            <div class="title-deck">
              <div class="title-name">${a.card}</div>
              <div class="title-sub">${[...a.decks].map(d =>
                `${d} ${colorsHtml(d, decksByName)}`).join(' · ')}</div>
              <div class="title-stars">${'\u{1f45f}'.repeat(a.n)}</div>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }

  async function load() {
    const [matchRes, deckRes, mvpRes] = await Promise.all([
      fetch('data/matches.json'),
      fetch('data/decks.json'),
      fetch('data/mvp.json')
    ]);
    const tournaments = await matchRes.json();
    const decks = await deckRes.json();
    const mvps = await mvpRes.json();

    const decksByName = Object.fromEntries(decks.map(d => [d.name, d]));

    document.getElementById('content').innerHTML = `
      <h2>Titles</h2>
      ${titlesHtml(tournaments, decksByName)}
      <h2>MVP awards</h2>
      ${mvpCardsHtml(mvps, decksByName)}
      ${scarpaCardsHtml(mvps, decksByName)}
      ${lowerSerieHtml(tournaments, decksByName, 'seriesB', 'Serie B')}
      ${lowerSerieHtml(tournaments, decksByName, 'seriesC', 'Serie C')}
      ${lowerSerieHtml(tournaments, decksByName, 'seriesD', 'Serie D')}
      ${lowerSerieHtml(tournaments, decksByName, 'seriesE', 'Serie E')}
    `;
  }

  load().catch(e => {
    document.getElementById('error').textContent = 'Error loading data: ' + e.message;
  });
</script>
</body>
</html>
