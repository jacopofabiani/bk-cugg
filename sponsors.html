<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sponsors - Bobby Kelzor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #fff;
      color: #000;
      min-height: 100vh;
      padding: 20px;
    }

    /* Wraps into as many rows as the screen needs, with every row centred,
       so a lone logo on the last row still sits in the middle. */
    .sponsor-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 40px;
      max-width: 900px;
      margin: 0 auto;
    }

    .sponsor-card {
      flex: 0 1 280px;
      display: flex;
      justify-content: center;
    }

    /* The wordmarks are wide and flat, so they fill a width; the CC Taste
       and Lion Kebab badges are held to a height instead. */
    .sponsor-card img {
      display: block;
      width: 85%;
      max-width: 280px;
    }

    .sponsor-card img.badge {
      width: auto;
      height: 200px;
    }
  </style>
  <script src="nav.js?v=6" defer></script>
</head>
<body>

<site-nav></site-nav>

<div class="sponsor-list">
  <div class="sponsor-card">
    <img src="images/sponsors/maersk.svg" alt="Maersk">
  </div>
  <div class="sponsor-card">
    <img src="images/sponsors/saxo.svg" alt="Saxo Bank">
  </div>
  <div class="sponsor-card">
    <img class="badge" src="images/sponsors/cctaste.png" alt="CC Taste">
  </div>
  <div class="sponsor-card">
    <img class="badge" src="images/sponsors/lionkebab.png" alt="Lion Kebab">
  </div>
</div>

</body>
</html>
