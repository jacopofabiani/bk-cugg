<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bobby Kelzor - MTG</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #fff;
      color: #000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      gap: 16px;
      padding: 16px 20px;
      background: #fff;
      border-bottom: 1px solid #eee;
    }

    nav a {
      color: #000;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.95rem;
    }

    nav a:hover { text-decoration: underline; }

    h1 {
      font-size: 2rem;
      margin-bottom: 8px;
      text-align: center;
    }

    .subtitle {
      color: #555;
      margin-bottom: 48px;
      text-align: center;
    }

    .nav-cards {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .nav-card {
      background: #fff;
      border: 1.5px solid #000;
      border-radius: 12px;
      padding: 32px 40px;
      text-decoration: none;
      color: #000;
      text-align: center;
      transition: background 0.15s;
      min-width: 160px;
    }

    .nav-card:hover { background: #f5f5f5; }

    .nav-card .icon { font-size: 2.4rem; margin-bottom: 12px; }

    .nav-card .label {
      font-size: 1.1rem;
      font-weight: bold;
    }
  </style>
  <script src="nav.js" defer></script>
</head>
<body>

<site-nav></site-nav>

  <h1>Bobby Kelzor</h1>

  <div class="nav-cards">
    <a class="nav-card" href="tournament.html">
      <div class="icon">🏆</div>
      <div class="label">Tournament</div>
    </a>
    <a class="nav-card" href="decks.html">
      <div class="icon">🃏</div>
      <div class="label">Decks</div>
    </a>
    <a class="nav-card" href="standings.html">
      <div class="icon">📊</div>
      <div class="label">Standings</div>
    </a>
    <a class="nav-card" href="mvp.html">
      <div class="icon">⭐</div>
      <div class="label">MVP</div>
    </a>
    <a class="nav-card" href="rules.html">
      <div class="icon">📋</div>
      <div class="label">Rules</div>
    </a>
  </div>

</body>
</html>
