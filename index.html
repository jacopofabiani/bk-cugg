<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bobby Kelzor - MTG</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    h1 {
      color: #c4b5fd;
      font-size: 2rem;
      margin-bottom: 8px;
      text-align: center;
    }

    .subtitle {
      color: #888;
      margin-bottom: 48px;
      text-align: center;
    }

    .nav-cards {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .nav-card {
      background: #16213e;
      border: 1px solid #2d2d5e;
      border-radius: 12px;
      padding: 32px 40px;
      text-decoration: none;
      color: #e0e0e0;
      text-align: center;
      transition: border-color 0.2s, background 0.2s;
      min-width: 160px;
    }

    .nav-card:hover {
      border-color: #a78bfa;
      background: #1e1e4a;
    }

    .nav-card .icon {
      font-size: 2.4rem;
      margin-bottom: 12px;
    }

    .nav-card .label {
      font-size: 1.1rem;
      font-weight: bold;
      color: #c4b5fd;
    }
  </style>
</head>
<body>

  <h1>Bobby Kelzor</h1>
  <p class="subtitle">MTG Tournament Tracker</p>

  <div class="nav-cards">
    <a class="nav-card" href="tournament.html">
      <div class="icon">🏆</div>
      <div class="label">Tournament</div>
    </a>
    <a class="nav-card" href="decks.html">
      <div class="icon">🃏</div>
      <div class="label">Decks</div>
    </a>
    <a class="nav-card" href="standings.html">
      <div class="icon">📊</div>
      <div class="label">Standings</div>
    </a>
  </div>

</body>
</html>
