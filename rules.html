<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rules - Bobby Kelzor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
    }

    nav {
      display: flex;
      gap: 16px;
      margin-bottom: 28px;
    }

    nav a {
      color: #a78bfa;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.95rem;
    }

    nav a:hover { text-decoration: underline; }

    h1 {
      color: #c4b5fd;
      font-size: 1.6rem;
      margin-bottom: 28px;
    }

    .section {
      background: #16213e;
      border: 1px solid #2d2d5e;
      border-radius: 12px;
      padding: 24px;
      max-width: 700px;
      margin-bottom: 20px;
    }

    .section-title {
      color: #a78bfa;
      font-size: 0.8rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 16px;
    }

    .rule-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .rule-list li {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .rule-list li .bullet {
      background: #0f3460;
      color: #c4b5fd;
      border-radius: 6px;
      padding: 2px 8px;
      font-weight: bold;
      font-size: 0.85rem;
      white-space: nowrap;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .points-table {
      width: 100%;
      border-collapse: collapse;
    }

    .points-table th {
      background: #0f3460;
      color: #a78bfa;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 10px 16px;
      text-align: left;
    }

    .points-table td {
      padding: 10px 16px;
      border-top: 1px solid #2d2d5e;
      font-size: 0.95rem;
    }

    .points-table tr:first-child td { border-top: none; }

    .pts {
      color: #c4b5fd;
      font-weight: bold;
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html">Home</a>
  <a href="tournament.html">Tournament</a>
  <a href="decks.html">Decks</a>
  <a href="standings.html">Standings</a>
  <a href="mvp.html">MVP</a>
  <a href="rules.html">Rules</a>
</nav>

<h1>Rules</h1>

<div class="section">
  <div class="section-title">Points System</div>
  <table class="points-table">
    <thead>
      <tr>
        <th>Achievement</th>
        <th>Points</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Each game won within a match</td>
        <td class="pts">+1 per game</td>
      </tr>
      <tr>
        <td>Reaching the Final (losing finalist)</td>
        <td class="pts">+2</td>
      </tr>
      <tr>
        <td>Winning the Final (tournament winner)</td>
        <td class="pts">+5</td>
      </tr>
    </tbody>
  </table>
</div>

</body>
</html>
