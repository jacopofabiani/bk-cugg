<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MVP - Bobby Kelzor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #fff;
      color: #000;
      min-height: 100vh;
      padding: 20px;
    }

    nav {
      display: flex;
      gap: 16px;
      margin-bottom: 28px;
    }

    nav a {
      color: #000;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.95rem;
    }

    nav a:hover { text-decoration: underline; }

    .mvp-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 500px;
    }

    .mvp-card {
      background: #fff;
      border: 1.5px solid #000;
      border-radius: 12px;
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .mvp-card-left {
      display: flex;
      gap: 16px;
      align-items: center;
      flex: 1;
    }

    .mvp-card-img {
      width: 120px;
      border-radius: 4px;
      flex-shrink: 0;
      border: 1px solid #000;
    }

    .mvp-card-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .mvp-tournament {
      color: #555;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .mvp-card-name {
      color: #000;
      font-size: 1.15rem;
      font-weight: bold;
    }

    .mvp-date { color: #555; font-size: 0.8rem; }

    .mvp-badge {
      background: #000;
      color: #fff;
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 4px 10px;
      border-radius: 20px;
      white-space: nowrap;
    }

    #error { color: red; margin-top: 20px; }
  </style>
  <script src="nav.js" defer></script>
</head>
<body>

<site-nav></site-nav>

<div id="mvp-list" class="mvp-list">
  <p style="color:#888">Loading...</p>
</div>
<p id="error"></p>

<script>
  async function load() {
    const res = await fetch('data/mvp.json');
    const mvps = await res.json();

    const list = document.getElementById('mvp-list');
    list.innerHTML = mvps.map(m => `
      <div class="mvp-card">
        <div class="mvp-card-left">
          ${m.image ? `<img class="mvp-card-img" src="${m.image}" alt="${m.card}">` : ''}
          <div class="mvp-card-info">
            <div class="mvp-tournament">${m.tournamentName}</div>
            <div class="mvp-card-name">${m.card}</div>
            <div class="mvp-date">${formatDate(m.date)} &middot; ${m.deck} deck</div>
          </div>
        </div>

      </div>
    `).join('');
  }

  function formatDate(str) {
    const [y, m, d] = str.split('-');
    return `${d}/${m}/${y}`;
  }

  load().catch(e => {
    document.getElementById('error').textContent = 'Error loading data: ' + e.message;
  });
</script>
</body>
</html>
