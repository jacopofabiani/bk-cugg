<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MVP - Bobby Kelzor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #fff;
      color: #000;
      min-height: 100vh;
      padding: 20px;
    }

    nav {
      display: flex;
      gap: 16px;
      margin-bottom: 28px;
    }

    nav a {
      color: #000;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.95rem;
    }

    nav a:hover { text-decoration: underline; }

    .mvp-list {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      justify-content: flex-start;
    }

    .mvp-card {
      background: #fff;
      border: 1.5px solid #000;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 180px;
    }

    .mvp-tournament {
      font-size: 1.1rem;
      font-weight: bold;
      text-align: center;
    }

    .mvp-card-img {
      width: 140px;
      border-radius: 4px;
      border: 1px solid #000;
    }

    .mvp-card-info {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      text-align: center;
    }

    .mvp-card-name {
      font-size: 0.9rem;
      font-weight: bold;
    }

    .mvp-deck {
      font-size: 0.8rem;
      color: #555;
    }

    #error { color: red; margin-top: 20px; }
  </style>
  <script src="nav.js" defer></script>
</head>
<body>

<site-nav></site-nav>

<div id="mvp-list" class="mvp-list">
  <p style="color:#888">Loading...</p>
</div>
<p id="error"></p>

<script>
  function toRoman(n) {
    const vals = [10,9,5,4,1];
    const syms = ['X','IX','V','IV','I'];
    let result = '';
    for (let i = 0; i < vals.length; i++) {
      while (n >= vals[i]) { result += syms[i]; n -= vals[i]; }
    }
    return result + '°';
  }

  async function load() {
    const res = await fetch('data/mvp.json');
    const mvps = await res.json();

    const list = document.getElementById('mvp-list');
    list.innerHTML = mvps.map(m => `
      <div class="mvp-card">
        <div class="mvp-tournament">${toRoman(m.tournamentId)}</div>
        ${m.image ? `<img class="mvp-card-img" src="${m.image}" alt="${m.card}">` : ''}
        <div class="mvp-card-info">
          <div class="mvp-card-name">${m.card}</div>
          <div class="mvp-deck">${m.deck}</div>
        </div>
      </div>
    `).join('');
  }

  load().catch(e => {
    document.getElementById('error').textContent = 'Error loading data: ' + e.message;
  });
</script>
</body>
</html>
