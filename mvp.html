<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MVP - Bobby Kelzor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #fff;
      color: #000;
      min-height: 100vh;
      padding: 20px;
    }

    .mvp-list {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: flex-start;
    }

    .mvp-card {
      background: #fff;
      border: 1.5px solid #000;
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 150px;
    }

    .mvp-tournament {
      font-size: 1.1rem;
      font-weight: bold;
      text-align: center;
    }

    .mvp-card-img {
      width: 118px;
      border-radius: 4px;
      border: 1px solid #000;
    }

    .mvp-card-info {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      text-align: center;
    }

    .mvp-card-name {
      font-size: 0.9rem;
      font-weight: bold;
    }

    .mvp-deck {
      font-size: 0.8rem;
      color: #555;
    }

    /* Scarpa d'Oro: same card, half the art -- it ranks below the MVP. */
    .scarpa {
      border-top: 1px solid #000;
      padding-top: 10px;
      margin-top: 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 100%;
    }

    .scarpa-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #555;
    }

    .scarpa-img {
      width: 62px;
      border-radius: 4px;
      border: 1px solid #000;
    }

    .scarpa-name {
      font-size: 0.8rem;
      font-weight: bold;
      text-align: center;
    }

    /* Phones: two cards per row whatever the width -- an iPhone SE is 320px. */
    @media (max-width: 600px) {
      body { padding: 16px 10px; }

      .mvp-list {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .mvp-card {
        width: auto;
        min-width: 0;
        padding: 12px 8px;
      }

      .mvp-card-img { width: 100%; }
      .scarpa-img { width: 60%; }
    }

    #error { color: red; margin-top: 20px; }
  </style>
  <script src="nav.js?v=2" defer></script>
</head>
<body>

<site-nav></site-nav>

<div id="mvp-list" class="mvp-list">
  <p style="color:#888">Loading...</p>
</div>
<p id="error"></p>

<script>
  function toRoman(n) {
    const vals = [10,9,5,4,1];
    const syms = ['X','IX','V','IV','I'];
    let result = '';
    for (let i = 0; i < vals.length; i++) {
      while (n >= vals[i]) { result += syms[i]; n -= vals[i]; }
    }
    return result + '°';
  }

  // Scarpa d'Oro arrived with the XXI edition -- earlier ones carry a null.
  function scarpaHtml(s) {
    if (!s) return '';
    return `
      <div class="scarpa">
        <div class="scarpa-label">Scarpa d'Oro</div>
        ${s.image ? `<img class="scarpa-img" src="${s.image}" alt="${s.card}">` : ''}
        <div class="scarpa-name">${s.card}</div>
        <div class="mvp-deck">${s.deck}</div>
      </div>
    `;
  }

  async function load() {
    const res = await fetch('data/mvp.json');
    const mvps = await res.json();

    const list = document.getElementById('mvp-list');
    list.innerHTML = mvps.map(m => `
      <div class="mvp-card">
        <div class="mvp-tournament">${toRoman(m.tournamentId)}</div>
        ${m.image ? `<img class="mvp-card-img" src="${m.image}" alt="${m.card}">` : ''}
        <div class="mvp-card-info">
          <div class="mvp-card-name">${m.card}</div>
          <div class="mvp-deck">${m.deck}</div>
        </div>
        ${scarpaHtml(m.scarpa)}
      </div>
    `).join('');
  }

  load().catch(e => {
    document.getElementById('error').textContent = 'Error loading data: ' + e.message;
  });
</script>
</body>
</html>
