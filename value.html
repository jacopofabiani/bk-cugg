<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Value - Bobby Kelzor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #fff;
      color: #000;
      min-height: 100vh;
      padding: 20px;
    }

    h1 { font-size: 1.6rem; margin-bottom: 20px; }

    table {
      width: auto;
      border-collapse: collapse;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      border: 1.5px solid #000;
      white-space: nowrap;
    }

    th {
      background: #000;
      color: #fff;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 7px 9px;
      text-align: left;
    }

    td {
      padding: 5px 9px;
      border-top: 1px solid #000;
      font-size: 0.95rem;
      color: #000;
    }

    tr:first-child td { border-top: none; }

    .rank { color: #555; font-size: 0.85rem; width: 28px; }
    .rank-1, .rank-2, .rank-3 { color: #000; font-weight: bold; }

    .deck-name { padding-right: 16px; }
    .deck-name a { color: #000; text-decoration: none; }
    .deck-name a:hover { text-decoration: underline; }

    th.value, td.value { text-align: right; }

    th button {
      all: unset;
      cursor: pointer;
      text-transform: inherit;
      letter-spacing: inherit;
    }
    th button:hover { text-decoration: underline; }
    th button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    th button::after { content: ' \2195'; opacity: 0.5; }
    th[aria-sort="descending"] button::after { content: ' \25BC'; opacity: 1; }
    td.value { font-weight: bold; }

    tfoot td {
      border-top: 3px solid #000;
      font-weight: bold;
    }

    .priced-on { color: #555; font-size: 0.85rem; margin-top: 16px; }

    #error { color: red; margin-top: 20px; }

    /* The table scrolls inside its own box if it ever gets wider than the
       screen, so the page itself never scrolls sideways. */
    .table-scroll { max-width: 100%; overflow-x: auto; }

    @media (max-width: 600px) {
      body { padding: 16px; }
      h1 { font-size: 1.4rem; }

      table { width: 100%; }
      th { font-size: 0.7rem; letter-spacing: 0; padding: 8px 6px; }
      td { font-size: 0.85rem; padding: 7px 6px; }
      .rank { width: 22px; font-size: 0.8rem; }
      .deck-name { padding-right: 6px; }

      /* bigger tap area for the sort buttons */
      th button { display: inline-block; padding: 4px 0; }
    }
  </style>
  <script src="nav.js?v=6" defer></script>
</head>
<body>

<site-nav></site-nav>

<h1>💰 Value</h1>
<div class="table-scroll">
<table>
  <thead>
    <tr>
      <th>#</th>
      <th>Deck</th>
      <th class="value" data-key="value_usd" aria-sort="descending"><button type="button">Cardtrader</button></th>
      <th class="value" data-key="value_cardmarket_usd"><button type="button">Cardmarket</button></th>
    </tr>
  </thead>
  <tbody id="rows">
    <tr><td colspan="4" style="color:#888">Loading...</td></tr>
  </tbody>
  <tfoot id="total"></tfoot>
</table>
</div>
<p id="error"></p>
<p class="priced-on" id="priced-on"></p>

<script>
  const usd = n => '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const shortDate = iso => iso.split('-').reverse().join('/');

  let priced = [];
  let sortKey = 'value_usd';

  // Highest first by the chosen price column; decks missing that price go last.
  function renderRows() {
    const sorted = [...priced].sort((a, b) => (b[sortKey] ?? -1) - (a[sortKey] ?? -1));
    document.querySelectorAll('th[data-key]').forEach(th => {
      if (th.dataset.key === sortKey) th.setAttribute('aria-sort', 'descending');
      else th.removeAttribute('aria-sort');
    });

    document.getElementById('rows').innerHTML = sorted.map((d, i) => `
      <tr>
        <td class="rank rank-${i + 1}">${i + 1}</td>
        <td class="deck-name"><a href="deck.html?id=${d.id}">${d.name}</a></td>
        <td class="value">${usd(d.value_usd)}</td>
        <td class="value">${d.value_cardmarket_usd != null ? usd(d.value_cardmarket_usd) : '—'}</td>
      </tr>
    `).join('');
  }

  document.querySelectorAll('th[data-key] button').forEach(btn => {
    btn.addEventListener('click', () => {
      sortKey = btn.parentElement.dataset.key;
      renderRows();
    });
  });

  async function load() {
    const decks = await (await fetch('data/decks.json')).json();

    // Retired decks have no Moxfield list, so they carry no value.
    priced = decks.filter(d => d.value_usd != null);
    renderRows();

    const total = priced.reduce((s, d) => s + d.value_usd, 0);
    const totalCm = priced.reduce((s, d) => s + (d.value_cardmarket_usd || 0), 0);
    document.getElementById('total').innerHTML = `
      <tr>
        <td></td>
        <td class="deck-name">Total</td>
        <td class="value">${usd(total)}</td>
        <td class="value">${usd(totalCm)}</td>
      </tr>
    `;

    // ISO dates sort as strings, so the first one is the oldest: every price is at least this fresh.
    const oldest = priced.map(d => d.value_priced_on).filter(Boolean).sort()[0];
    if (oldest) document.getElementById('priced-on').textContent = `Prices updated on ${shortDate(oldest)}.`;
  }

  load().catch(e => {
    document.getElementById('error').textContent = 'Error loading data: ' + e.message;
  });
</script>
</body>
</html>
