<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tournament - Bobby Kelzor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
    }

    nav {
      display: flex;
      gap: 16px;
      margin-bottom: 28px;
    }

    nav a {
      color: #a78bfa;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.95rem;
    }

    nav a:hover { text-decoration: underline; }

    h1 {
      color: #c4b5fd;
      font-size: 1.6rem;
      margin-bottom: 4px;
    }

    .meta {
      color: #888;
      font-size: 0.9rem;
      margin-bottom: 28px;
    }

    .bracket {
      display: flex;
      gap: 40px;
      align-items: center;
      overflow-x: auto;
      padding-bottom: 16px;
    }

    .round {
      display: flex;
      flex-direction: column;
      gap: 24px;
      min-width: 160px;
    }

    .round-title {
      color: #a78bfa;
      font-size: 0.8rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .match {
      background: #16213e;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #2d2d5e;
    }

    .match-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      font-size: 0.9rem;
      gap: 8px;
    }

    .match-row + .match-row {
      border-top: 1px solid #2d2d5e;
    }

    .match-row.winner {
      background: #1e3a5f;
      font-weight: bold;
      color: #fff;
    }

    .score {
      background: #0f3460;
      color: #c4b5fd;
      font-weight: bold;
      border-radius: 4px;
      padding: 2px 8px;
      min-width: 24px;
      text-align: center;
    }

    .winner .score {
      background: #5a2ca0;
      color: #fff;
    }

    .trophy-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      min-width: 120px;
    }

    .trophy {
      position: relative;
      width: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 18px 18px 0;
    }

    /* Sparkles */
    .trophy::before {
      content: '✦ ✦ ✦';
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.55rem;
      color: #fbbf24;
      letter-spacing: 4px;
      white-space: nowrap;
      animation: sparkle 1.4s ease-in-out infinite alternate;
    }

    .trophy-bowl::before,
    .trophy-bowl::after {
      content: '✦';
      position: absolute;
      font-size: 0.6rem;
      color: #fbbf24;
      background: transparent;
      border: none;
      width: auto;
      height: auto;
      animation: sparkle 1.4s ease-in-out infinite alternate;
    }

    .trophy-bowl::before {
      top: -14px;
      left: -16px;
    }

    .trophy-bowl::after {
      top: -14px;
      right: -16px;
    }

    @keyframes sparkle {
      from { opacity: 0.4; transform: scale(0.85); }
      to   { opacity: 1;   transform: scale(1.15); }
    }

    /* Bowl */
    .trophy-bowl {
      width: 54px;
      height: 42px;
      background: #c4b5fd;
      border-radius: 4px 4px 28px 28px;
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      font-weight: bold;
      color: #3b0764;
      letter-spacing: 0.05em;
    }

    /* Handles - use separate elements now */
    .trophy-handle-left,
    .trophy-handle-right {
      position: absolute;
      top: 6px;
      width: 14px;
      height: 18px;
      border: 4px solid #c4b5fd;
      border-radius: 50%;
      background: transparent;
    }

    .trophy-handle-left {
      left: -14px;
      border-right: none;
    }

    .trophy-handle-right {
      right: -14px;
      border-left: none;
    }

    /* Stem */
    .trophy-stem {
      width: 8px;
      height: 14px;
      background: #c4b5fd;
    }

    /* Base */
    .trophy-base {
      width: 44px;
      height: 7px;
      background: #c4b5fd;
      border-radius: 3px;
    }

    .winner-label {
      background: #5a2ca0;
      color: #fff;
      font-weight: bold;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 1rem;
      text-align: center;
    }

    .mvp-section {
      margin-top: 36px;
      background: #16213e;
      border: 1px solid #5a2ca0;
      border-radius: 10px;
      padding: 16px 24px;
      display: inline-block;
    }

    .mvp-label {
      color: #a78bfa;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }

    .mvp-name {
      color: #fff;
      font-size: 1.2rem;
      font-weight: bold;
    }

    .selector {
      display: flex;
      gap: 8px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .selector-btn {
      background: #16213e;
      border: 1px solid #2d2d5e;
      color: #a78bfa;
      font-size: 0.85rem;
      font-weight: bold;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .selector-btn:hover {
      border-color: #a78bfa;
    }

    .selector-btn.active {
      background: #5a2ca0;
      border-color: #5a2ca0;
      color: #fff;
    }

    #error {
      color: #f87171;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html">Home</a>
  <a href="tournament.html">Tournament</a>
  <a href="decks.html">Decks</a>
  <a href="standings.html">Standings</a>
  <a href="mvp.html">MVP</a>
  <a href="rules.html">Rules</a>
</nav>

<div id="selector" class="selector"></div>
<div id="content">
  <p style="color:#888">Loading...</p>
</div>
<p id="error"></p>

<script>
  let allTournaments = [];

  async function load() {
    const res = await fetch('data/matches.json');
    allTournaments = await res.json();

    // Build selector buttons
    const selector = document.getElementById('selector');
    selector.innerHTML = allTournaments.map((t, i) => `
      <button class="selector-btn ${i === allTournaments.length - 1 ? 'active' : ''}"
              onclick="showTournament(${i})"
              id="btn-${i}">
        ${t.name}
      </button>
    `).join('');

    showTournament(allTournaments.length - 1);
  }

  function showTournament(index) {
    // Update active button
    allTournaments.forEach((_, i) => {
      document.getElementById(`btn-${i}`).classList.toggle('active', i === index);
    });

    const t = allTournaments[index];
    const content = document.getElementById('content');

    let html = `
      <h1>${t.name}</h1>
      <div class="meta">${formatDate(t.date)}</div>
      <div class="bracket">
    `;

    for (const round of t.rounds) {
      html += `<div class="round">`;
      html += `<div class="round-title">${round.name}</div>`;
      for (const m of round.matches) {
        const w1 = m.score1 > m.score2;
        const w2 = m.score2 > m.score1;
        html += `
          <div class="match">
            <div class="match-row ${w1 ? 'winner' : ''}">
              <span>${m.player1}</span>
              <span class="score">${m.score1}</span>
            </div>
            <div class="match-row ${w2 ? 'winner' : ''}">
              <span>${m.player2}</span>
              <span class="score">${m.score2}</span>
            </div>
          </div>
        `;
      }
      html += `</div>`;
    }

    html += `
        <div class="trophy-section">
          <div class="trophy">
            <div class="trophy-bowl">
              <div class="trophy-handle-left"></div>
              BOB
              <div class="trophy-handle-right"></div>
            </div>
            <div class="trophy-stem"></div>
            <div class="trophy-base"></div>
          </div>
          <div class="winner-label">${t.winner}</div>
        </div>
      </div>
      <div class="mvp-section">
        <div class="mvp-label">MVP</div>
        <div class="mvp-name">${t.mvp}</div>
      </div>
    `;

    content.innerHTML = html;
  }

  function formatDate(str) {
    const [y, m, d] = str.split('-');
    return `${d}/${m}/${y}`;
  }

  load().catch(e => {
    document.getElementById('error').textContent = 'Error loading data: ' + e.message;
  });
</script>
</body>
</html>
