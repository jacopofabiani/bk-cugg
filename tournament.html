<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tournament - Bobby Kelzor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
    }

    nav {
      display: flex;
      gap: 16px;
      margin-bottom: 28px;
    }

    nav a {
      color: #a78bfa;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.95rem;
    }

    nav a:hover { text-decoration: underline; }

    h1 {
      color: #c4b5fd;
      font-size: 1.6rem;
      margin-bottom: 4px;
    }

    .meta {
      color: #888;
      font-size: 0.9rem;
      margin-bottom: 28px;
    }

    .bracket {
      display: flex;
      gap: 40px;
      align-items: center;
      overflow-x: auto;
      padding-bottom: 16px;
    }

    .round {
      display: flex;
      flex-direction: column;
      gap: 24px;
      min-width: 160px;
    }

    .round-title {
      color: #a78bfa;
      font-size: 0.8rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .match {
      background: #16213e;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #2d2d5e;
    }

    .match-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      font-size: 0.9rem;
      gap: 8px;
    }

    .match-row + .match-row {
      border-top: 1px solid #2d2d5e;
    }

    .match-row.winner {
      background: #1e3a5f;
      font-weight: bold;
      color: #fff;
    }

    .score {
      background: #0f3460;
      color: #c4b5fd;
      font-weight: bold;
      border-radius: 4px;
      padding: 2px 8px;
      min-width: 24px;
      text-align: center;
    }

    .winner .score {
      background: #5a2ca0;
      color: #fff;
    }

    .trophy-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      min-width: 120px;
    }

    .trophy {
      font-size: 3rem;
    }

    .winner-label {
      background: #5a2ca0;
      color: #fff;
      font-weight: bold;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 1rem;
      text-align: center;
    }

    .mvp-section {
      margin-top: 36px;
      background: #16213e;
      border: 1px solid #5a2ca0;
      border-radius: 10px;
      padding: 16px 24px;
      display: inline-block;
    }

    .mvp-label {
      color: #a78bfa;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }

    .mvp-name {
      color: #fff;
      font-size: 1.2rem;
      font-weight: bold;
    }

    #error {
      color: #f87171;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html">Home</a>
  <a href="tournament.html">Tournament</a>
  <a href="decks.html">Decks</a>
  <a href="standings.html">Standings</a>
</nav>

<div id="content">
  <p style="color:#888">Loading...</p>
</div>
<p id="error"></p>

<script>
  async function load() {
    const res = await fetch('data/matches.json');
    const tournaments = await res.json();
    const t = tournaments[0]; // first tournament

    const content = document.getElementById('content');

    let html = `
      <h1>${t.name}</h1>
      <div class="meta">${formatDate(t.date)}</div>
      <div class="bracket">
    `;

    for (const round of t.rounds) {
      html += `<div class="round">`;
      html += `<div class="round-title">${round.name}</div>`;
      for (const m of round.matches) {
        const w1 = m.score1 > m.score2;
        const w2 = m.score2 > m.score1;
        html += `
          <div class="match">
            <div class="match-row ${w1 ? 'winner' : ''}">
              <span>${m.player1}</span>
              <span class="score">${m.score1}</span>
            </div>
            <div class="match-row ${w2 ? 'winner' : ''}">
              <span>${m.player2}</span>
              <span class="score">${m.score2}</span>
            </div>
          </div>
        `;
      }
      html += `</div>`;
    }

    html += `
        <div class="trophy-section">
          <div class="trophy">🏆</div>
          <div class="winner-label">${t.winner}</div>
        </div>
      </div>
      <div class="mvp-section">
        <div class="mvp-label">MVP</div>
        <div class="mvp-name">${t.mvp}</div>
      </div>
    `;

    content.innerHTML = html;
  }

  function formatDate(str) {
    const [y, m, d] = str.split('-');
    return `${d}/${m}/${y}`;
  }

  load().catch(e => {
    document.getElementById('error').textContent = 'Error loading data: ' + e.message;
  });
</script>
</body>
</html>
