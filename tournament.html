<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tournament - Bobby Kelzor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #fff;
      color: #000;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 4px;
    }

    .meta {
      color: #555;
      font-size: 0.9rem;
      margin-bottom: 28px;
    }

    .bracket {
      display: flex;
      gap: 40px;
      align-items: center;
      overflow-x: auto;
      padding-bottom: 16px;
    }

    .round {
      display: flex;
      flex-direction: column;
      gap: 24px;
      min-width: 160px;
    }

    .round--r16 {
      flex-direction: row;
      flex-wrap: wrap;
      min-width: unset;
      max-width: 100%;
    }

    .round--r16 .round-title {
      width: 100%;
      flex-shrink: 0;
    }

    .round--r16 .match {
      width: 200px;
    }

    .round-title {
      font-size: 0.8rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
      color: #555;
    }

    .match {
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      border: 1.5px solid #000;
    }

    .match-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      font-size: 0.9rem;
      gap: 8px;
      color: #000;
    }

    .match-row + .match-row {
      border-top: 1.5px solid #000;
    }

    .match-row.winner {
      background: #000;
      font-weight: bold;
      color: #fff;
    }

    .score {
      background: #fff;
      color: #000;
      font-weight: bold;
      border-radius: 4px;
      border: 1px solid #000;
      padding: 2px 8px;
      min-width: 24px;
      text-align: center;
    }

    .winner .score {
      background: #000;
      color: #fff;
      border-color: #fff;
    }

    .trophy-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      min-width: 120px;
    }

    .trophy {
      position: relative;
      width: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 18px 18px 0;
    }

    /* Sparkles */
    .trophy::before {
      content: '✦ ✦ ✦';
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.55rem;
      color: #000;
      letter-spacing: 4px;
      white-space: nowrap;
      animation: sparkle 1.4s ease-in-out infinite alternate;
    }

    .trophy-bowl::before,
    .trophy-bowl::after {
      content: '✦';
      position: absolute;
      font-size: 0.6rem;
      color: #000;
      background: transparent;
      border: none;
      width: auto;
      height: auto;
      animation: sparkle 1.4s ease-in-out infinite alternate;
    }

    .trophy-bowl::before {
      top: -14px;
      left: -16px;
    }

    .trophy-bowl::after {
      top: -14px;
      right: -16px;
    }

    @keyframes sparkle {
      from { opacity: 0.4; transform: scale(0.85); }
      to   { opacity: 1;   transform: scale(1.15); }
    }

    /* Bowl */
    .trophy-bowl {
      width: 54px;
      height: 42px;
      background: #000;
      border-radius: 4px 4px 28px 28px;
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      font-weight: bold;
      color: #fff;
      letter-spacing: 0.05em;
    }

    /* Handles - use separate elements now */
    .trophy-handle-left,
    .trophy-handle-right {
      position: absolute;
      top: 6px;
      width: 14px;
      height: 18px;
      border: 4px solid #000;
      border-radius: 50%;
      background: transparent;
    }

    .trophy-handle-left {
      left: -14px;
      border-right: none;
    }

    .trophy-handle-right {
      right: -14px;
      border-left: none;
    }

    /* Stem */
    .trophy-stem {
      width: 8px;
      height: 14px;
      background: #000;
    }

    /* Base */
    .trophy-base {
      width: 44px;
      height: 7px;
      background: #000;
      border-radius: 3px;
    }

    /* Serie B's cup: the same lines as the Serie A one, drawn tall and slim.
       The elliptical bottom radius is what tapers the body down to the foot. */
    .trophy--b { width: 46px; }

    .trophy--b .trophy-bowl {
      width: 36px;
      height: 58px;
      border-radius: 4px 4px 18px 18px / 4px 4px 46px 46px;
      flex-direction: column;
      justify-content: flex-start;
      padding-top: 9px;
      font-size: 0.55rem;
      line-height: 1.15;
    }

    .trophy--b .trophy-handle-left,
    .trophy--b .trophy-handle-right {
      top: 7px;
      width: 13px;
      height: 17px;
    }

    .trophy--b .trophy-handle-left  { left: -13px; }
    .trophy--b .trophy-handle-right { right: -13px; }

    /* Pushed out to clear the handles on the narrower bowl. */
    .trophy--b .trophy-bowl::before { left: -20px; }
    .trophy--b .trophy-bowl::after  { right: -20px; }

    .trophy--b .trophy-stem { width: 6px; height: 10px; }
    .trophy--b .trophy-base { width: 30px; height: 6px; }

    /* Serie C's prize is a medal, not a cup: a ribboned disc built from the
       same three pieces -- the bowl becomes the disc, the right handle becomes
       the ribbon, and the stem and base drop out. The whole medal is turned a
       quarter turn so the disc hangs under the ribbon, which also stands the
       lettering back up; the top margin reserves the room the ribbon needs
       once it has swung above the disc. */
    .trophy--c {
      width: 56px;
      margin-top: 70px;
    }

    /* Clear of the ribbon, which now stands above the disc. */
    .trophy--c::before { top: -66px; }

    .trophy--c .trophy-bowl {
      width: 56px;
      height: 56px;
      box-sizing: border-box;
      transform: rotate(-90deg);
      border: 4px solid #000;
      border-radius: 50%;
      background: #fff;
      color: #000;
      /* Written down the disc, so the quarter turn leaves it upright. */
      writing-mode: vertical-rl;
      gap: 3px;
      font-size: 0.55rem;
    }

    .trophy--c .trophy-handle-left { display: none; }

    /* Ribbon: a trapezoid flaring out from the disc, narrow edge flush against
       it. The two pseudo-elements sit inside as white then black, so the shape
       reads as nested folds rather than one solid block. */
    .trophy--c .trophy-handle-right {
      top: 50%;
      right: -52px;
      width: 52px;
      height: 48px;
      margin-top: -24px;
      border: none;
      border-radius: 0;
      background: #000;
      clip-path: polygon(0 26%, 100% 0, 100% 100%, 0 74%);
    }

    .trophy--c .trophy-handle-right::before,
    .trophy--c .trophy-handle-right::after {
      content: '';
      position: absolute;
      left: 0;
      clip-path: polygon(0 26%, 100% 0, 100% 100%, 0 74%);
    }

    .trophy--c .trophy-handle-right::before {
      top: 4px;
      bottom: 4px;
      right: 4px;
      background: #fff;
    }

    .trophy--c .trophy-handle-right::after {
      top: 9px;
      bottom: 9px;
      right: 9px;
      background: #000;
    }

    /* Both sparkles move to the free side, clear of the ribbon. */
    .trophy--c .trophy-bowl::before {
      top: -10px;
      left: -18px;
    }

    .trophy--c .trophy-bowl::after {
      top: auto;
      right: auto;
      bottom: -10px;
      left: -18px;
    }

    .trophy--c .trophy-stem,
    .trophy--c .trophy-base { display: none; }

    .winner-label {
      background: #000;
      color: #fff;
      font-weight: bold;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 1rem;
      text-align: center;
    }

    /* A/B editions stack two brackets on one page; each gets a heading. */
    .series-title {
      font-size: 1.15rem;
      margin: 4px 0 16px;
      padding-bottom: 6px;
      border-bottom: 1.5px solid #000;
    }

    .series-title + .bracket { margin-top: 0; }

    .awards {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 16px;
      margin-top: 36px;
    }

    .mvp-section {
      background: #fff;
      border: 1.5px solid #000;
      border-radius: 10px;
      padding: 16px 24px;
      display: inline-block;
    }

    /* Scarpa d'Oro is the secondary title, so it gets a smaller card and art. */
    .mvp-section--scarpa .mvp-name { font-size: 1rem; }
    .mvp-section--scarpa img { width: 80px; }

    .mvp-label {
      color: #555;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }

    .mvp-name {
      color: #000;
      font-size: 1.2rem;
      font-weight: bold;
    }

    .selector {
      display: flex;
      gap: 8px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .selector-btn {
      background: #fff;
      border: 1.5px solid #000;
      color: #000;
      font-size: 0.85rem;
      font-weight: bold;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .selector-btn:hover { background: #f5f5f5; }

    .selector-btn.active {
      background: #000;
      color: #fff;
    }

    .groups-section {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      margin-bottom: 36px;
    }

    .group-table {
      border: 1.5px solid #000;
      border-radius: 10px;
      overflow: hidden;
      min-width: 220px;
    }

    .group-table-title {
      background: #000;
      color: #fff;
      font-size: 0.8rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 6px 14px;
    }

    .group-table table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    .group-table th {
      text-align: left;
      padding: 6px 14px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #555;
      border-bottom: 1.5px solid #000;
    }

    .group-table th.center,
    .group-table td.center {
      text-align: center;
    }

    .group-table td {
      padding: 6px 14px;
      border-bottom: 1px solid #eee;
    }

    .group-table tr:last-child td { border-bottom: none; }

    .group-table tr.qualified td { font-weight: bold; }

    .group-table tr.qualified td:first-child::after {
      content: ' ↑';
      font-size: 0.7rem;
      color: #555;
    }

    #error {
      color: red;
      margin-top: 20px;
    }

    .points-section {
      margin-top: 36px;
      display: inline-block;
    }

    .points-title {
      font-size: 0.8rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #555;
      margin-bottom: 8px;
    }

    .points-table-wrapper {
      border: 2px solid #000;
      border-radius: 10px;
      overflow: hidden;
      display: inline-block;
    }

    .points-table {
      border-collapse: collapse;
      font-size: 0.85rem;
      min-width: 280px;
    }

    .points-table th {
      text-align: left;
      padding: 6px 14px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #555;
      border-bottom: 1.5px solid #000;
      background: #fff;
    }

    .points-table td {
      padding: 6px 14px;
      border-bottom: 1px solid #eee;
    }

    .points-table tr:last-child td { border-bottom: none; }

    .points-table .center { text-align: center; }
  </style>
  <script src="nav.js?v=2" defer></script>
</head>
<body>

<site-nav></site-nav>

<div id="selector" class="selector"></div>
<div id="content">
  <p style="color:#888">Loading...</p>
</div>
<p id="error"></p>

<script>
  let allTournaments = [];
  let allMvps = [];
  let allPoints = [];

  async function load() {
    const [matchRes, mvpRes, pointsRes] = await Promise.all([
      fetch('data/matches.json'),
      fetch('data/mvp.json'),
      fetch('data/points.json')
    ]);
    allTournaments = await matchRes.json();
    allMvps = await mvpRes.json();
    allPoints = await pointsRes.json();

    // Build selector buttons
    const selector = document.getElementById('selector');
    selector.innerHTML = allTournaments.map((t, i) => `
      <button class="selector-btn ${i === allTournaments.length - 1 ? 'active' : ''}"
              onclick="showTournament(${i})"
              id="btn-${i}">
        ${t.name.split('°')[0]}°
      </button>
    `).join('');

    showTournament(allTournaments.length - 1);
  }

  function buildGroupsHtml(t) {
    if (!t.groups || t.groups.length === 0) return '';

    let html = '<div class="groups-section">';

    for (const g of t.groups) {
      html += `
        <div class="group-table">
          <div class="group-table-title">Group ${g.name}</div>
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Deck</th>
              </tr>
            </thead>
            <tbody>
              ${g.standings.map((deck, i) => `
                <tr class="${i < g.qualified ? 'qualified' : ''}">
                  <td>${i + 1}</td>
                  <td>${deck}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    html += '</div>';
    return html;
  }

  function buildPointsHtml(tournamentId) {
    const entry = allPoints.find(p => p.tournamentId === tournamentId);
    if (!entry) return '';
    const rows = entry.scores.filter(s => s.total > 0).sort((a, b) => b.total - a.total);
    if (rows.length === 0) return '';
    return `
      <div class="points-section">
        <div class="points-title">Points</div>
        <div class="points-table-wrapper">
        <table class="points-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Deck</th>
              <th class="center">Wins</th>
              <th class="center">Bonus</th>
              <th class="center">Total</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map((s, i) => `
              <tr>
                <td>${i + 1}</td>
                <td>${s.deck}</td>
                <td class="center">${s.gamePoints}</td>
                <td class="center">${s.bonusGroup + s.bonusFinalist + s.bonusWinner}</td>
                <td class="center"><strong>${s.total}</strong></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
        </div>
      </div>
    `;
  }

  // Prizes that differ from the Serie A cup: Serie B gets the tall slim shape
  // and Serie C a ribboned medal. Both carry their letter under BOB; the other
  // series fall back to the default cup.
  const TROPHY_VARIANT = { 'Serie B': 'trophy--b', 'Serie C': 'trophy--c' };

  // Renders one bracket end to end: rounds, trophy and awards. A normal edition
  // calls this once; a multi-series edition calls it again for each of Serie B,
  // C and D, which carry their own winner and awards on the tournament object.
  function seriesHtml(s) {
    const trophyVariant = TROPHY_VARIANT[s.label] || '';
    const trophyText = trophyVariant
      ? `<span>BOB</span><span>${s.label.replace('Serie ', '')}</span>`
      : `<span>BOB</span>`;
    let html = s.label ? `<h2 class="series-title">${s.label}</h2>` : '';
    html += '<div class="bracket">\n';

    for (const round of s.rounds) {
      if (round.stageBreak) html += `</div><div class="bracket">`;
      const isWide = ['Round of 32', 'Round of 16', 'Round of 24', 'Round of 28', 'Round of 12', 'Play-in'].includes(round.name);
      html += `<div class="round${isWide ? ' round--r16' : ''}">`;
      html += `<div class="round-title">${round.name}</div>`;
      for (const m of round.matches) {
        const w1 = m.score1 > m.score2;
        const w2 = m.score2 > m.score1;
        html += `
          <div class="match">
            <div class="match-row ${w1 ? 'winner' : ''}">
              <span>${m.player1}</span>
              <span class="score">${m.score1}</span>
            </div>
            <div class="match-row ${w2 ? 'winner' : ''}">
              <span>${m.player2}</span>
              <span class="score">${m.score2}</span>
            </div>
          </div>
        `;
      }
      html += `</div>`;
    }

    html += `
        <div class="trophy-section">
          <div class="trophy ${trophyVariant}">
            <div class="trophy-bowl">
              <div class="trophy-handle-left"></div>
              ${trophyText}
              <div class="trophy-handle-right"></div>
            </div>
            <div class="trophy-stem"></div>
            <div class="trophy-base"></div>
          </div>
          <div class="winner-label">${s.winner}</div>
        </div>
      </div>
      <div class="awards">
        <div class="mvp-section">
          <div class="mvp-label">MVP</div>
          ${s.mvpImage ? `<img src="${s.mvpImage}" alt="${s.mvp}" style="width:120px;border-radius:4px;border:1px solid #000;margin-bottom:8px;display:block">` : ''}
          <div class="mvp-name">${s.mvp}</div>
        </div>
        ${s.scarpa ? `
        <div class="mvp-section mvp-section--scarpa">
          <div class="mvp-label">${s.scarpaLabel || "Scarpa d'Oro"}</div>
          ${s.scarpaImage ? `<img src="${s.scarpaImage}" alt="${s.scarpa}" style="border-radius:4px;border:1px solid #000;margin-bottom:8px;display:block">` : ''}
          <div class="mvp-name">${s.scarpa}</div>
        </div>` : ''}
      </div>
    `;
    return html;
  }

  function showTournament(index) {
    // Update active button
    allTournaments.forEach((_, i) => {
      document.getElementById(`btn-${i}`).classList.toggle('active', i === index);
    });

    const t = allTournaments[index];
    const mvpData = allMvps.find(m => m.tournamentId === t.id);
    const content = document.getElementById('content');

    let html = `
      <h1>${t.name}</h1>
      <div class="meta">${formatDateRange(t.startDate, t.endDate)}${t.type ? ` · ${t.type}` : ''}</div>
      ${t.type === 'groups' ? buildGroupsHtml(t) : ''}
    `;

    // Scarpa d'Oro arrived with the XXI edition -- earlier ones carry a null,
    // so seriesHtml drops the block when there is no card.
    html += seriesHtml({
      label: t.seriesLabel,
      rounds: t.rounds,
      winner: t.winner,
      mvp: t.mvp,
      mvpImage: mvpData?.image,
      scarpa: t.scarpa || mvpData?.scarpa?.card,
      scarpaImage: mvpData?.scarpa?.image
    });

    for (const key of ['seriesB', 'seriesC', 'seriesD', 'seriesE']) {
      if (t[key]) html += seriesHtml(t[key]);
    }

    html += `
      <br>
      ${buildPointsHtml(t.id)}
    `;

    content.innerHTML = html;
  }

  function formatDate(str) {
    const [y, m, d] = str.split('-');
    return `${d}/${m}/${y}`;
  }

  function formatDateRange(start, end) {
    return start === end ? formatDate(start) : `${formatDate(start)} – ${formatDate(end)}`;
  }

  load().catch(e => {
    document.getElementById('error').textContent = 'Error loading data: ' + e.message;
  });
</script>
</body>
</html>
