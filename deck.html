<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deck - Bobby Kelzor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #fff;
      color: #000;
      min-height: 100vh;
      padding: 20px;
    }

    h1 { font-size: 1.6rem; margin-bottom: 24px; }

    .section {
      background: #fff;
      border: 1.5px solid #000;
      border-radius: 12px;
      padding: 24px;
      max-width: 500px;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 0.8rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 16px;
      color: #555;
    }

    .colors {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }

    .color-pip {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 1px solid #000;
    }

    .color-W { background: #f9fafb; }
    .color-U { background: #3b82f6; }
    .color-B { background: #1f2937; }
    .color-R { background: #ef4444; }
    .color-G { background: #22c55e; }
    .color-C { background: #9ca3af; }

    .tournament-line { font-size: 0.85rem; }

    .tournament-line + .tournament-line { margin-top: 10px; }

    .tournament-label { color: #555; }

    /* Deck overview box: colors and tournaments on the left, numbers on the right. */
    .identity {
      display: flex;
      justify-content: space-between;
      gap: 16px;
    }

    /* Both columns span the box height: colors / total points on top,
       tournaments / anzianita pinned to the bottom. */
    .identity-main,
    .identity-side {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
    }

    .identity-side {
      align-items: flex-end;
      text-align: right;
    }

    .identity-side .section-title { margin-bottom: 6px; }

    .identity-value {
      font-weight: bold;
      font-size: 1.6rem;
      line-height: 1;
    }

    .albo-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 12px;
    }

    .albo-row:last-child { margin-bottom: 0; }

    .albo-count {
      font-size: 1.6rem;
      font-weight: bold;
      line-height: 1;
      min-width: 28px;
    }

    .albo-label {
      font-size: 0.8rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #555;
    }

    .albo-medals { font-size: 0.95rem; }

    .albo-editions {
      font-size: 0.85rem;
      color: #555;
      margin-top: 2px;
    }

    .albo-note {
      font-size: 0.8rem;
      color: #777;
      margin: -8px 0 16px;
    }

    /* Marks where the lower-series roll of honour starts. */
    .albo-sep {
      border-top: 1px solid #ddd;
      padding-top: 14px;
    }

    .moxfield-link {
      display: inline-block;
      margin-top: 4px;
      color: #000;
      font-weight: bold;
      font-size: 0.95rem;
      text-decoration: none;
      border-bottom: 1.5px solid #000;
      padding-bottom: 1px;
    }

    .moxfield-link:hover { opacity: 0.6; }

    .top-card {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 6px 0;
      border-top: 1px solid #ddd;
      font-size: 0.95rem;
    }

    .deck-value + .top-card { border-top: none; padding-top: 0; }

    .top-card-price { font-weight: bold; white-space: nowrap; }

    .deck-value {
      font-weight: bold;
      font-size: 1rem;
      margin-bottom: 14px;
    }

    #error { color: red; margin-top: 20px; }
  </style>
  <script src="nav.js?v=4" defer></script>
</head>
<body>

<site-nav></site-nav>

<div id="content"><p style="color:#888">Loading...</p></div>
<p id="error"></p>

<script>
  // The finalist that isn't the winner, matching albo.html: the closing round
  // is usually one match, but an edition can end in a round robin between the
  // last decks standing, where the runner-up places second on wins.
  function runnerUp(t) {
    const last = t.rounds[t.rounds.length - 1];
    if (!last || !last.matches.length) return null;

    if (last.matches.length === 1) {
      const m = last.matches[0];
      return m.score1 > m.score2 ? m.player2 : m.player1;
    }

    const wins = {};
    for (const m of last.matches) {
      const won  = m.score1 > m.score2 ? m.player1 : m.player2;
      const lost = m.score1 > m.score2 ? m.player2 : m.player1;
      wins[won]  = (wins[won] || 0) + 1;
      wins[lost] = wins[lost] || 0;
    }
    const ranked = Object.entries(wins).sort((a, b) => b[1] - a[1]);
    return ranked.length > 1 ? ranked[1][0] : null;
  }

  // The lower brackets of a multi-series edition, in the order they are listed.
  // A tournament only carries the ones it actually ran.
  const LOWER_SERIES = [
    ['seriesB', 'Serie B'],
    ['seriesC', 'Serie C'],
    ['seriesD', 'Serie D'],
    ['seriesE', 'Serie E']
  ];

  function alboRow(list, label, medal, cls = '') {
    return list.length ? `
      <div class="albo-row ${cls}">
        <div class="albo-count">${list.length}</div>
        <div>
          <div class="albo-label">${label}</div>
          <div class="albo-medals">${medal.repeat(list.length)}</div>
          <div class="albo-editions">${list.map(t => t.name).join(' · ')}</div>
        </div>
      </div>
    ` : '';
  }

  // This deck's roll of honour. Only Serie A counts as a Bob Kelzor title, the
  // same rule albo.html applies, so the lower brackets are kept below the
  // Serie A rows and under their own medal.
  function alboHtml(deck, tournaments) {
    const titles    = tournaments.filter(t => t.winner === deck.name);
    const runnerUps = tournaments.filter(t => runnerUp(t) === deck.name);

    const serieARows = alboRow(titles, 'Titles', '\u{1f3c6}')
                     + alboRow(runnerUps, 'Runner-ups', '\u{1f948}');

    // The divider goes on whichever lower-series row comes first, so it only
    // shows up when there is something above it to separate.
    let lowerRows = '';
    for (const [key, label] of LOWER_SERIES) {
      const eds = tournaments.filter(t => t[key]);
      const won  = eds.filter(t => t[key].winner === deck.name);
      const lost = eds.filter(t => runnerUp(t[key]) === deck.name);
      for (const [list, suffix, medal] of [[won, 'wins', '\u{1f3c5}'], [lost, 'runner-ups', '\u{1f948}']]) {
        const sep = !lowerRows && serieARows ? 'albo-sep' : '';
        lowerRows += alboRow(list, `${label} ${suffix}`, medal, sep);
      }
    }

    if (!serieARows && !lowerRows) return '';

    const note = lowerRows
      ? `<p class="albo-note">Lower-series results do not count towards Bob Kelzor titles.</p>`
      : '';

    return `
      <div class="section">
        <div class="section-title">Palmares</div>
        ${note}
        ${serieARows}
        ${lowerRows}
      </div>
    `;
  }

  async function load() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    if (!id) { window.location.href = 'decks.html'; return; }

    const [decksRes, matchesRes, pointsRes] = await Promise.all([
      fetch('data/decks.json'),
      fetch('data/matches.json'),
      fetch('data/points.json')
    ]);
    const decks = await decksRes.json();
    const tournaments = await matchesRes.json();
    const points = await pointsRes.json();
    const deck = decks.find(d => d.id === id);

    if (!deck) { window.location.href = 'decks.html'; return; }

    // Find first tournament this deck appeared in. Use points.json: it lists every
    // entrant, including decks knocked out in a group stage (whose matches aren't kept).
    const firstEntry = points.find(p => p.scores.some(s => s.deck === deck.name));
    const firstTournament = firstEntry && tournaments.find(t => t.id === firstEntry.tournamentId);

    document.title = `${deck.name} - Bobby Kelzor`;

    const colorPips = deck.colors.map(c => `<div class="color-pip color-${c}"></div>`).join('');

    const moxfieldSection = deck.moxfield ? `
      <div class="section">
        <div class="section-title">Decklist</div>
        <a class="moxfield-link" href="${deck.moxfield}" target="_blank" rel="noopener">View on Moxfield &rarr;</a>
      </div>
    ` : '';

    const usd = n => '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    // Cardtrader prices from Moxfield, stored in decks.json; see value.html.
    const valueSection = deck.top_cards ? `
      <div class="section">
        <div class="section-title">Most Expensive Cards</div>
        <div class="deck-value">Deck value: ${usd(deck.value_usd)}</div>
        ${deck.top_cards.map(c => `
          <div class="top-card">
            <span>${c.name}</span>
            <span class="top-card-price">${usd(c.price)}</span>
          </div>
        `).join('')}
      </div>
    ` : '';

    const firstTournamentLine = firstTournament ? `
      <div class="tournament-line">
        <div class="tournament-label">First Tournament:</div>
        <div>${firstTournament.name}, ${formatDate(firstTournament.startDate)}</div>
      </div>
    ` : '';

    // A retired deck carries the edition it bowed out in and the points it
    // collected over its whole career; live decks carry neither.
    const lastTournament = tournaments.find(t => t.id === deck.last_edition);
    const lastTournamentLine = lastTournament ? `
      <div class="tournament-line">
        <div class="tournament-label">Last Tournament:</div>
        <div>${lastTournament.name}, ${formatDate(lastTournament.endDate)}</div>
      </div>
    ` : '';

    // Career points across every edition, summed the same way as standings.html.
    // Retired decks also store this as total_points; the sum matches it.
    const totalPoints = points
      .flatMap(p => p.scores)
      .filter(s => s.deck === deck.name)
      .reduce((sum, s) => sum + s.total, 0);

    const totalPointsBlock = `
      <div>
        <div class="section-title">Total Points</div>
        <div class="identity-value">${totalPoints}</div>
      </div>
    `;

    const anzianitaBlock = deck.anzianita != null ? `
      <div>
        <div class="section-title">Anzianità</div>
        <div class="identity-value">${deck.anzianita}</div>
      </div>
    ` : '';

    document.getElementById('content').innerHTML = `
      <h1>${deck.name}</h1>
      <div class="section identity">
        <div class="identity-main">
          <div class="colors">
            ${colorPips}
          </div>
          <div class="tournaments">
            ${firstTournamentLine}
            ${lastTournamentLine}
          </div>
        </div>
        <div class="identity-side">
          ${totalPointsBlock}
          ${anzianitaBlock || '<div></div>'}
        </div>
      </div>
      ${alboHtml(deck, tournaments)}
      ${moxfieldSection}
      ${valueSection}
    `;
  }

  function formatDate(str) {
    const [y, m, d] = str.split('-');
    return `${d}/${m}/${y}`;
  }

  load().catch(e => {
    document.getElementById('error').textContent = 'Error loading data: ' + e.message;
  });
</script>
</body>
</html>
