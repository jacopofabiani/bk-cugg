<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Statistics - Bobby Kelzor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #fff;
      color: #000;
      min-height: 100vh;
      padding: 20px;
    }

    h1 { font-size: 1.6rem; margin-bottom: 6px; }

    .subtitle {
      color: #555;
      font-size: 0.9rem;
      margin-bottom: 28px;
    }

    h2 {
      font-size: 1.15rem;
      margin: 38px 0 4px;
    }

    .section-note {
      color: #555;
      font-size: 0.8rem;
      margin-bottom: 14px;
    }

    .wrap { max-width: 980px; }

    /* --- KPI row --- */
    /* grid, not flex: `flex:1` sizes from a zero basis, so min-width overflows
       the row on narrow screens instead of wrapping */
    .kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
    }

    .kpi {
      border: 1.5px solid #000;
      border-radius: 10px;
      padding: 14px 18px;
    }

    .kpi-value {
      font-size: 1.9rem;
      font-weight: bold;
      line-height: 1;
    }

    .kpi-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #555;
      margin-top: 6px;
    }

    /* --- record cards --- */
    .records {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 12px;
    }

    .record {
      border: 1.5px solid #000;
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .record-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #555;
    }

    .record-value { font-size: 1.15rem; font-weight: bold; }
    .record-detail { font-size: 0.8rem; color: #555; }

    /* --- tables --- */
    .table-wrap {
      border: 1.5px solid #000;
      border-radius: 10px;
      overflow: hidden;
    }

    .scroll-x { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    th {
      text-align: left;
      padding: 8px 12px;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #555;
      border-bottom: 1.5px solid #000;
      white-space: nowrap;
    }

    td {
      padding: 7px 12px;
      border-bottom: 1px solid #eee;
      white-space: nowrap;
    }

    tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: #fafafa; }

    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .deck-cell { font-weight: bold; }
    .muted { color: #888; }

    /* --- inline magnitude bar: single hue, 2px gap, rounded data end --- */
    .bar-cell { width: 190px; }

    .bar-track {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .bar-rail {
      flex: 1;
      height: 8px;
      background: #f0f0f0;
      border-radius: 4px;
      overflow: hidden;
      min-width: 60px;
    }

    .bar-fill {
      height: 100%;
      background: #000;
      border-radius: 4px;
    }

    .bar-value {
      font-variant-numeric: tabular-nums;
      font-size: 0.8rem;
      width: 38px;
      text-align: right;
    }

    /* --- colors --- */
    .color-pip {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1px solid #000;
      display: inline-block;
      vertical-align: -3px;
      margin-right: 8px;
    }

    .color-W { background: #f9fafb; }
    .color-U { background: #3b82f6; }
    .color-B { background: #1f2937; }
    .color-R { background: #ef4444; }
    .color-G { background: #22c55e; }
    .color-C { background: #9ca3af; }

    #error { color: red; margin-top: 20px; }

    @media (max-width: 600px) {
      .bar-cell { width: 120px; }
    }
  </style>
  <script src="nav.js?v=2" defer></script>
</head>
<body>

<site-nav></site-nav>

<div class="wrap">
  <h1>Statistics</h1>
  <div class="subtitle">Every edition of the Torneo Bob Kelzor, crunched.</div>

  <div id="content">
    <p style="color:#888">Loading...</p>
  </div>
  <p id="error"></p>
</div>

<script>
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const pct = (n, d) => d ? Math.round(100 * n / d) : 0;

  function fmtDate(str) {
    const [y, m, d] = str.split('-');
    return `${d}/${m}/${y}`;
  }

  function toRoman(n) {
    const vals = [10, 9, 5, 4, 1];
    const syms = ['X', 'IX', 'V', 'IV', 'I'];
    let out = '';
    for (let i = 0; i < vals.length; i++) {
      while (n >= vals[i]) { out += syms[i]; n -= vals[i]; }
    }
    return out + '°';
  }

  // The finalist that isn't the winner. Nearly every edition closes on a
  // single match, but XVIII ended in a group between the last three decks --
  // there second place goes on wins inside that group.
  function runnerUp(t) {
    const last = t.rounds[t.rounds.length - 1];
    if (!last || !last.matches.length) return null;

    if (last.matches.length === 1) {
      const m = last.matches[0];
      return m.score1 > m.score2 ? m.player2 : m.player1;
    }

    const wins = {};
    for (const m of last.matches) {
      const won  = m.score1 > m.score2 ? m.player1 : m.player2;
      const lost = m.score1 > m.score2 ? m.player2 : m.player1;
      wins[won]  = (wins[won] || 0) + 1;
      wins[lost] = wins[lost] || 0;
    }
    const ranked = Object.entries(wins).sort((a, b) => b[1] - a[1]);
    return ranked.length > 1 ? ranked[1][0] : null;
  }

  function bar(value, max, label) {
    const w = (max && value) ? Math.max(2, Math.round(100 * value / max)) : 0;
    return `
      <div class="bar-track">
        <div class="bar-rail"><div class="bar-fill" style="width:${w}%"></div></div>
        <span class="bar-value">${label}</span>
      </div>
    `;
  }

  function kpis(stats) {
    const items = [
      [stats.editions, 'Editions'],
      [stats.decks, 'Decks'],
      [stats.games, 'Games played'],
      [stats.champions, 'Different champions']
    ];
    return `<div class="kpis">${items.map(([v, l]) => `
      <div class="kpi">
        <div class="kpi-value">${v}</div>
        <div class="kpi-label">${l}</div>
      </div>
    `).join('')}</div>`;
  }

  function recordCards(cards) {
    return `<div class="records">${cards.map(c => `
      <div class="record">
        <div class="record-label">${esc(c.label)}</div>
        <div class="record-value">${esc(c.value)}</div>
        <div class="record-detail">${esc(c.detail)}</div>
      </div>
    `).join('')}</div>`;
  }

  // align: per-column 'left' | 'num', defaulting to left for the first column
  function simpleTable(headers, rows, align) {
    const cls = i => (align ? align[i] : (i ? 'num' : 'left')) === 'num' ? 'num' : '';
    return `
      <div class="table-wrap scroll-x">
        <table>
          <thead><tr>${headers.map((h, i) => `<th class="${cls(i)}">${esc(h)}</th>`).join('')}</tr></thead>
          <tbody>${rows.map(r => `<tr>${r.map((c, i) => `<td class="${cls(i)}">${c}</td>`).join('')}</tr>`).join('')}</tbody>
        </table>
      </div>
    `;
  }

  async function load() {
    const [matchRes, pointsRes, deckRes] = await Promise.all([
      fetch('data/matches.json'),
      fetch('data/points.json'),
      fetch('data/decks.json')
    ]);
    const tournaments = await matchRes.json();
    const points = await pointsRes.json();
    const decks = await deckRes.json();

    const colorsOf = Object.fromEntries(decks.map(d => [d.name, d.colors]));

    // ---- flatten the knockout stage (group matches aren't recorded) ----
    // Multi-series editions play extra brackets under seriesB/C/D. Those
    // matches count towards records and streaks; only their titles do not
    // (see below).
    const bracketsOf = t => ['seriesB', 'seriesC', 'seriesD', 'seriesE'].reduce(
      (acc, key) => acc.concat(t[key]?.rounds || []), t.rounds);
    const ko = [];
    for (const t of tournaments) {
      for (const r of bracketsOf(t)) {
        for (const m of r.matches) ko.push({ tournament: t, round: r.name, ...m });
      }
    }

    // ---- per-deck knockout record ----
    const rec = {};
    const touch = d => rec[d] ||= { w: 0, l: 0, gf: 0, ga: 0 };
    for (const m of ko) {
      for (const [deck, gf, ga] of [[m.player1, m.score1, m.score2], [m.player2, m.score2, m.score1]]) {
        const r = touch(deck);
        r.gf += gf; r.ga += ga;
        gf > ga ? r.w++ : r.l++;
      }
    }

    // ---- titles, finals, editions, points ----
    const titles = {}, finals = {}, runnerUps = {}, editions = {}, totalPoints = {};
    for (const t of tournaments) {
      titles[t.winner] = (titles[t.winner] || 0) + 1;
      // Reaching the final means finishing first or second, so a group final
      // counts its winner and its runner-up and no one else.
      const second = runnerUp(t);
      for (const d of [t.winner, second]) if (d) finals[d] = (finals[d] || 0) + 1;
      if (second) runnerUps[second] = (runnerUps[second] || 0) + 1;
    }
    for (const p of points) {
      for (const s of p.scores) {
        editions[s.deck] = (editions[s.deck] || 0) + 1;
        totalPoints[s.deck] = (totalPoints[s.deck] || 0) + s.total;
      }
    }

    // ---- rivalries ----
    const pairs = {};
    for (const m of ko) {
      const [a, b] = [m.player1, m.player2];
      const aWon = m.score1 > m.score2;
      const key = [a, b].sort().join('|');
      const p = pairs[key] ||= { a: [a, b].sort()[0], b: [a, b].sort()[1], n: 0, wins: {} };
      p.n++;
      const winner = aWon ? a : b;
      p.wins[winner] = (p.wins[winner] || 0) + 1;
    }

    // ---- streaks, in chronological knockout order ----
    const cur = {}, best = {}, curL = {}, worst = {};
    for (const m of ko) {
      const winner = m.score1 > m.score2 ? m.player1 : m.player2;
      const loser = m.score1 > m.score2 ? m.player2 : m.player1;
      cur[winner] = (cur[winner] || 0) + 1;
      best[winner] = Math.max(best[winner] || 0, cur[winner]);
      cur[loser] = 0;
      curL[loser] = (curL[loser] || 0) + 1;
      worst[loser] = Math.max(worst[loser] || 0, curL[loser]);
      curL[winner] = 0;
    }

    // ================= render =================
    const deckRows = Object.keys(rec).map(deck => {
      const r = rec[deck];
      const played = r.w + r.l;
      return {
        deck, colors: colorsOf[deck] || [],
        editions: editions[deck] || 0,
        titles: titles[deck] || 0,
        finals: finals[deck] || 0,
        runnerUps: runnerUps[deck] || 0,
        w: r.w, l: r.l, gf: r.gf, ga: r.ga, played,
        winPct: pct(r.w, played),
        points: totalPoints[deck] || 0
      };
    }).sort((a, b) => b.titles - a.titles || b.winPct - a.winPct || b.points - a.points);


    const topStreak = Object.entries(best).sort((a, b) => b[1] - a[1])[0];
    const worstStreak = Object.entries(worst).sort((a, b) => b[1] - a[1])[0];
    const bestRate = deckRows.filter(r => r.played >= 8).sort((a, b) => b.winPct - a.winPct)[0];
    const topPair = Object.values(pairs).sort((a, b) => b.n - a.n)[0];
    const mostLost = [...deckRows].sort((a, b) => b.ga - a.ga || b.l - a.l)[0];
    const champ = deckRows.filter(r => r.titles).sort((a, b) => b.titles - a.titles)[0];
    const nearly = deckRows.filter(r => !r.titles).sort((a, b) => b.finals - a.finals || b.points - a.points)[0];

    // ---- one-number records ----
    const days = t => Math.round((new Date(t.endDate) - new Date(t.startDate)) / 864e5);
    const longest = [...tournaments].sort((a, b) => days(b) - days(a))[0];

    // The longest a champion has waited between two of its own titles, counted
    // in editions it went without.
    const titleRuns = {};
    tournaments.forEach((t, i) => (titleRuns[t.winner] ||= []).push(i));
    let drought = null;
    for (const [deck, ix] of Object.entries(titleRuns)) {
      for (let i = 1; i < ix.length; i++) {
        const gap = ix[i] - ix[i - 1] - 1;
        if (!drought || gap > drought.gap)
          drought = { deck, gap, from: tournaments[ix[i - 1]].id, to: tournaments[ix[i]].id };
      }
    }

    let bigScore = null;
    for (const p of points) {
      for (const sc of p.scores) {
        if (!bigScore || sc.total > bigScore.total)
          bigScore = { deck: sc.deck, total: sc.total, id: p.tournamentId };
      }
    }

    document.getElementById('content').innerHTML = `
      ${kpis({
        editions: tournaments.length,
        decks: decks.length,
        games: ko.reduce((a, m) => a + m.score1 + m.score2, 0),
        champions: Object.keys(titles).length
      })}

      <h2>Hall of records</h2>
      <div class="section-note">Superlatives across all ${tournaments.length} editions.</div>
      ${recordCards([
        { label: 'Most titles', value: `${champ.deck} · ${champ.titles}`, detail: `${champ.finals} finals reached` },
        { label: 'Longest win streak', value: `${topStreak[0]} · ${topStreak[1]}`, detail: 'consecutive knockout matches won' },
        { label: 'Longest lose streak', value: `${worstStreak[0]} · ${worstStreak[1]}`, detail: 'consecutive knockout matches lost' },
        { label: 'Best match win rate', value: `${bestRate.deck} · ${bestRate.winPct}%`, detail: `${bestRate.w}–${bestRate.l} in the knockout stage` },
        { label: 'Fiercest rivalry', value: `${topPair.a} v ${topPair.b}`,
          detail: `${topPair.n} meetings · ${Object.entries(topPair.wins).map(([d, n]) => `${d} ${n}`).join(', ')}` },
        { label: 'Best without a title', value: nearly ? nearly.deck : '–',
          detail: nearly ? `${nearly.finals} final${nearly.finals === 1 ? '' : 's'} lost · ${nearly.points} points` : '' },
        { label: 'Longest tournament', value: `${toRoman(longest.id)} · ${days(longest)} days`,
          detail: `${fmtDate(longest.startDate)} to ${fmtDate(longest.endDate)}` },
        { label: 'Longest title drought', value: drought ? `${drought.deck} · ${drought.gap} editions` : '–',
          detail: drought ? `between ${toRoman(drought.from)} and ${toRoman(drought.to)}` : '' },
        { label: 'Most points in one edition', value: `${bigScore.deck} · ${bigScore.total}`,
          detail: `at ${toRoman(bigScore.id)}` },
        { label: 'Most games lost', value: `${mostLost.deck} · ${mostLost.ga}`,
          detail: `${mostLost.l} matches lost of ${mostLost.played} · ${mostLost.gf} games won` }
      ])}

      <h2>Finals</h2>
      <div class="section-note">Runner-ups are the finals a deck lost; conversion is the share of its finals it won.</div>
      ${simpleTable(['Deck', 'Finals', 'Titles', 'Runner-ups', 'Conversion'],
        deckRows.filter(r => r.finals)
          .sort((a, b) => b.runnerUps - a.runnerUps || b.finals - a.finals || a.deck.localeCompare(b.deck))
          .map(r => [
            `<span class="deck-cell">${esc(r.deck)}</span>`,
            r.finals,
            r.titles || '<span class="muted">–</span>',
            r.runnerUps || '<span class="muted">–</span>',
            `${pct(r.titles, r.finals)}%`
          ]), ['left', 'num', 'num', 'num', 'num'])}

      <h2>Rivalries</h2>
      <div class="section-note">Pairings that have met most often in the knockout stage.</div>
      ${simpleTable(['Matchup', 'Meetings', 'Record'],
        Object.values(pairs).sort((a, b) => b.n - a.n || a.a.localeCompare(b.a)).slice(0, 8).map(p => [
          `<span class="deck-cell">${esc(p.a)}</span> v <span class="deck-cell">${esc(p.b)}</span>`,
          p.n,
          Object.entries(p.wins).sort((x, y) => y[1] - x[1]).map(([d, n]) => `${esc(d)} ${n}`).join(' · ')
        ]))}

      <h2>Colors</h2>
      <div class="section-note">Every knockout match counts towards each colour in the deck's identity, so multicolour decks appear more than once.</div>
      ${(() => {
        const col = {};
        for (const m of ko) {
          for (const [deck, gf, ga] of [[m.player1, m.score1, m.score2], [m.player2, m.score2, m.score1]]) {
            for (const c of (colorsOf[deck] || [])) {
              const x = col[c] ||= { w: 0, l: 0, titles: 0 };
              gf > ga ? x.w++ : x.l++;
            }
          }
        }
        for (const t of tournaments) for (const c of (colorsOf[t.winner] || [])) (col[c] ||= { w: 0, l: 0, titles: 0 }).titles++;
        const names = { W: 'White', U: 'Blue', B: 'Black', R: 'Red', G: 'Green' };
        const rows = 'WUBRG'.split('').filter(c => col[c]);
        const maxRate = Math.max(...rows.map(c => pct(col[c].w, col[c].w + col[c].l)));
        return simpleTable(['Colour', 'W–L', 'Match win rate', 'Titles'], rows.map(c => [
          `<span class="color-pip color-${c}"></span><span class="deck-cell">${names[c]}</span>`,
          `${col[c].w}–${col[c].l}`,
          `<div class="bar-cell">${bar(pct(col[c].w, col[c].w + col[c].l), maxRate, pct(col[c].w, col[c].w + col[c].l) + '%')}</div>`,
          col[c].titles
        ]), ['left', 'num', 'left', 'num']);
      })()}

      <h2>Formats</h2>
      <div class="section-note">Every edition runs under one of a handful of formats.</div>
      ${(() => {
        const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
        const agg = {};
        for (const t of tournaments) {
          const a = agg[t.type] ||= { eds: [], titles: {} };
          a.eds.push(t.id);
          a.titles[t.winner] = (a.titles[t.winner] || 0) + 1;
        }
        const fmts = Object.keys(agg).sort((a, b) => agg[b].eds.length - agg[a].eds.length);

        const summary = simpleTable(
          ['Format', 'Editions', 'Champions'],
          fmts.map(f => {
            const a = agg[f];
            return [
              `<span class="deck-cell">${esc(cap(f))}</span>`,
              `${a.eds.length} <span class="muted">${a.eds.map(toRoman).join(', ')}</span>`,
              Object.entries(a.titles).sort((x, y) => y[1] - x[1] || x[0].localeCompare(y[0]))
                .map(([d, n]) => `${esc(d)} ${n}`).join(' · ')
            ];
          }), ['left', 'left', 'left']);

        return summary;
      })()}
    `;
  }

  load().catch(e => {
    document.getElementById('error').textContent = 'Error loading data: ' + e.message;
  });
</script>
</body>
</html>
