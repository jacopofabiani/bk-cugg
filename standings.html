<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Standings - Bobby Kelzor</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
    }

    nav {
      display: flex;
      gap: 16px;
      margin-bottom: 28px;
    }

    nav a {
      color: #a78bfa;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.95rem;
    }

    nav a:hover { text-decoration: underline; }

    h1 {
      color: #c4b5fd;
      font-size: 1.6rem;
      margin-bottom: 28px;
    }

    .chart-container {
      background: #16213e;
      border: 1px solid #2d2d5e;
      border-radius: 12px;
      padding: 24px;
      max-width: 800px;
      margin-bottom: 40px;
    }

    .chart-title {
      color: #a78bfa;
      font-size: 0.8rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 16px;
    }

    /* Leaderboard table */
    .leaderboard {
      max-width: 800px;
    }

    .leaderboard-title {
      color: #a78bfa;
      font-size: 0.8rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #16213e;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #2d2d5e;
    }

    th {
      background: #0f3460;
      color: #a78bfa;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 10px 16px;
      text-align: left;
    }

    td {
      padding: 10px 16px;
      border-top: 1px solid #2d2d5e;
      font-size: 0.95rem;
    }

    tr:first-child td { border-top: none; }

    .rank {
      color: #888;
      font-size: 0.85rem;
      width: 32px;
    }

    .rank-1 { color: #fbbf24; font-weight: bold; }
    .rank-2 { color: #9ca3af; font-weight: bold; }
    .rank-3 { color: #b45309; font-weight: bold; }

    .total-pts {
      font-weight: bold;
      color: #c4b5fd;
    }

    .sub-pts {
      color: #888;
      font-size: 0.8rem;
    }

    .selector {
      display: flex;
      gap: 8px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .selector-btn {
      background: #16213e;
      border: 1px solid #2d2d5e;
      color: #a78bfa;
      font-size: 0.85rem;
      font-weight: bold;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .selector-btn:hover { border-color: #a78bfa; }

    .selector-btn.active {
      background: #5a2ca0;
      border-color: #5a2ca0;
      color: #fff;
    }

    #error {
      color: #f87171;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html">Home</a>
  <a href="tournament.html">Tournament</a>
  <a href="decks.html">Decks</a>
  <a href="standings.html">Standings</a>
  <a href="mvp.html">MVP</a>
  <a href="rules.html">Rules</a>
</nav>

<h1>Standings</h1>

<div id="selector" class="selector"></div>

<div class="chart-container">
  <div class="chart-title">Total Points by Deck</div>
  <canvas id="chart" height="100"></canvas>
</div>

<div class="leaderboard">
  <div class="leaderboard-title">Leaderboard</div>
  <table id="table">
    <thead>
      <tr>
        <th>#</th>
        <th>Deck</th>
        <th>Game Pts</th>
        <th>Bonus</th>
        <th>Total</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<p id="error"></p>

<script>
  let allTournaments = [];
  let chartInstance = null;

  async function load() {
    const res = await fetch('data/points.json');
    allTournaments = await res.json();

    // Build selector: "After T1", "After T2", ..., "All Time"
    const selector = document.getElementById('selector');
    selector.innerHTML = allTournaments.map((t, i) => `
      <button class="selector-btn ${i === allTournaments.length - 1 ? 'active' : ''}"
              onclick="showStandings(${i})"
              id="sbtn-${i}">
        After ${t.tournamentName}
      </button>
    `).join('');

    showStandings(allTournaments.length - 1);
  }

  function showStandings(upToIndex) {
    // Update active button
    allTournaments.forEach((_, i) => {
      document.getElementById(`sbtn-${i}`).classList.toggle('active', i === upToIndex);
    });

    // Accumulate points up to selected tournament
    const totals = {}, gameMap = {}, bonusMap = {};
    for (let i = 0; i <= upToIndex; i++) {
      for (const s of allTournaments[i].scores) {
        totals[s.deck]   = (totals[s.deck]   || 0) + s.total;
        gameMap[s.deck]  = (gameMap[s.deck]   || 0) + s.gamePoints;
        bonusMap[s.deck] = (bonusMap[s.deck]  || 0) + s.bonusFinalist + s.bonusWinner;
      }
    }

    const sorted = Object.keys(totals)
      .map(deck => ({ deck, total: totals[deck], game: gameMap[deck], bonus: bonusMap[deck] }))
      .sort((a, b) => b.total - a.total);

    // Chart — destroy and recreate to avoid animation glitch
    if (chartInstance) chartInstance.destroy();
    chartInstance = new Chart(document.getElementById('chart'), {
      type: 'bar',
      data: {
        labels: sorted.map(d => d.deck),
        datasets: [
          {
            label: 'Game Points',
            data: sorted.map(d => d.game),
            backgroundColor: '#3b82f6',
            borderRadius: 4,
          },
          {
            label: 'Bonus Points',
            data: sorted.map(d => d.bonus),
            backgroundColor: '#a78bfa',
            borderRadius: 4,
          }
        ]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { labels: { color: '#e0e0e0', font: { size: 12 } } },
          tooltip: {
            callbacks: {
              footer: (items) => 'Total: ' + items.reduce((s, i) => s + i.raw, 0)
            }
          }
        },
        scales: {
          x: { stacked: true, ticks: { color: '#e0e0e0' }, grid: { color: '#2d2d5e' } },
          y: { stacked: true, ticks: { color: '#e0e0e0', stepSize: 1 }, grid: { color: '#2d2d5e' }, beginAtZero: true }
        }
      }
    });

    // Table
    const tbody = document.getElementById('tbody');
    tbody.innerHTML = sorted.map((d, i) => {
      const rankClass = i === 0 ? 'rank-1' : i === 1 ? 'rank-2' : i === 2 ? 'rank-3' : '';
      return `
        <tr>
          <td class="rank ${rankClass}">${i + 1}</td>
          <td>${d.deck}</td>
          <td class="sub-pts">${d.game}</td>
          <td class="sub-pts">${d.bonus}</td>
          <td class="total-pts">${d.total}</td>
        </tr>
      `;
    }).join('');
  }

  load().catch(e => {
    document.getElementById('error').textContent = 'Error loading data: ' + e.message;
  });
</script>
</body>
</html>
