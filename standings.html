<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Standings - Bobby Kelzor</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #fff;
      color: #000;
      min-height: 100vh;
      padding: 20px;
    }

    .selector {
      display: flex;
      gap: 8px;
      margin-bottom: 28px;
      flex-wrap: wrap;
      align-items: center;
    }

    .selector-label {
      font-size: 0.8rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #555;
      margin-right: 4px;
    }

    .selector-btn {
      background: #fff;
      border: 1.5px solid #000;
      color: #000;
      font-size: 0.85rem;
      font-weight: bold;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .selector-btn:hover { background: #f5f5f5; }

    .selector-btn.active {
      background: #000;
      color: #fff;
    }

    .chart-container {
      background: #fff;
      border: 1.5px solid #000;
      border-radius: 12px;
      padding: 24px;
      max-width: 900px;
      margin-bottom: 40px;
    }

    .chart-title {
      font-size: 0.8rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 16px;
      color: #555;
    }

    .leaderboard { max-width: 800px; }

    .leaderboard-title {
      font-size: 0.8rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
      color: #555;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      border: 1.5px solid #000;
    }

    th {
      background: #000;
      color: #fff;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 8px 10px;
      text-align: left;
    }

    th.sortable {
      cursor: pointer;
      user-select: none;
    }

    th.sortable:hover { background: #222; }

    th.sort-asc::after  { content: ' ▲'; font-size: 0.65rem; }
    th.sort-desc::after { content: ' ▼'; font-size: 0.65rem; }

    td {
      padding: 6px 10px;
      border-top: 1px solid #000;
      font-size: 0.95rem;
      color: #000;
    }

    tr:first-child td { border-top: none; }

    .rank { color: #555; font-size: 0.85rem; width: 32px; }
    .rank-1 { color: #000; font-weight: bold; }
    .rank-2 { color: #000; font-weight: bold; }
    .rank-3 { color: #000; font-weight: bold; }

    .total-pts { font-weight: bold; }
    .sub-pts { color: #555; font-size: 0.85rem; }

    #error { color: red; margin-top: 20px; }
  </style>
  <script src="nav.js?v=2" defer></script>
</head>
<body>

<site-nav></site-nav>

<div id="selector" class="selector"></div>

<div class="chart-container">
  <div class="chart-title"></div>
  <canvas id="chart"></canvas>
</div>

<div class="leaderboard">
  <table id="table">
    <thead>
      <tr>
        <th>#</th>
        <th class="sortable" onclick="sortBy('deck')">Deck</th>
        <th class="sortable" onclick="sortBy('tournaments')">#T</th>
        <th class="sortable" onclick="sortBy('games')">Games</th>
        <th class="sortable" onclick="sortBy('game')">Wins</th>
        <th class="sortable" onclick="sortBy('bonus')">Bonus</th>
        <th class="sortable" onclick="sortBy('total')">Total</th>
        <th class="sortable" onclick="sortBy('ppg')">PPG</th>
        <th class="sortable" onclick="sortBy('ppt')">PPT</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<p id="error"></p>

<script>
  let allTournaments = [];
  let allMatches = [];
  let chartInstance = null;
  let currentSorted = [];
  let sortKey = 'total';
  let sortDir = -1; // -1 = desc, 1 = asc
  let selectedDecks = new Set();

  // 10 distinct colors for deck lines
  const DECK_COLORS = [
    '#e6194b','#3cb44b','#4363d8','#f58231','#911eb4',
    '#42d4f4','#f032e6','#bfef45','#fabed4','#469990'
  ];
  let deckColorMap = {};

  async function load() {
    const [pointsRes, matchesRes] = await Promise.all([
      fetch('data/points.json'),
      fetch('data/matches.json')
    ]);
    allTournaments = await pointsRes.json();
    allMatches = await matchesRes.json();

    // Collect all decks across all tournaments
    const deckSet = new Set();
    for (const t of allTournaments) {
      for (const s of t.scores) deckSet.add(s.deck);
    }
    const allDecks = [...deckSet].sort();

    // Assign colors
    allDecks.forEach((deck, i) => {
      deckColorMap[deck] = DECK_COLORS[i % DECK_COLORS.length];
    });

    // Default: select all decks
    selectedDecks = new Set(allDecks);

    // Build deck selector
    const selector = document.getElementById('selector');
    selector.innerHTML =
      `<span class="selector-label">Decks:</span>` +
      `<button class="selector-btn active" id="btn-all" onclick="toggleAll()">All</button>` +
      allDecks.map(deck => `
        <button class="selector-btn active"
                id="dbtn-${deck}"
                onclick="toggleDeck('${deck}')">
          ${deck}
        </button>
      `).join('');

    renderChart();
    showStandings();
  }

  function toggleAll() {
    const allDecks = Object.keys(deckColorMap);
    const allSelected = allDecks.every(d => selectedDecks.has(d));
    if (allSelected) {
      // deselect all
      selectedDecks.clear();
    } else {
      // select all
      allDecks.forEach(d => selectedDecks.add(d));
    }
    allDecks.forEach(d => {
      document.getElementById(`dbtn-${d}`).classList.toggle('active', selectedDecks.has(d));
    });
    document.getElementById('btn-all').classList.toggle('active', !allSelected);
    renderChart();
  }

  function toggleDeck(deck) {
    if (selectedDecks.has(deck)) {
      selectedDecks.delete(deck);
    } else {
      selectedDecks.add(deck);
    }
    document.getElementById(`dbtn-${deck}`).classList.toggle('active', selectedDecks.has(deck));
    const allDecks = Object.keys(deckColorMap);
    document.getElementById('btn-all').classList.toggle('active', allDecks.every(d => selectedDecks.has(d)));
    renderChart();
  }

  function renderChart() {
    // Build cumulative points per deck per tournament
    const labels = allTournaments.map((_, i) => `T${i + 1}`);
    const deckTotals = {}; // deck -> cumulative after each tournament

    for (const deck of Object.keys(deckColorMap)) {
      deckTotals[deck] = [];
      let cumulative = 0;
      let started = false;
      for (const t of allTournaments) {
        const score = t.scores.find(s => s.deck === deck);
        if (score) {
          started = true;
          cumulative += score.total;
        }
        deckTotals[deck].push(started ? cumulative : null);
      }
    }

    const datasets = Object.keys(deckColorMap)
      .filter(deck => selectedDecks.has(deck))
      .map(deck => ({
        label: deck,
        data: deckTotals[deck],
        borderColor: deckColorMap[deck],
        backgroundColor: deckColorMap[deck],
        borderWidth: 2,
        pointRadius: 4,
        pointHoverRadius: 6,
        tension: 0.3,
        fill: false,
      }));

    if (chartInstance) chartInstance.destroy();
    chartInstance = new Chart(document.getElementById('chart'), {
      type: 'line',
      data: { labels, datasets },
      options: {
        responsive: true,
        plugins: {
          legend: {
            labels: { color: '#000', font: { size: 12 }, boxWidth: 16 }
          },
          tooltip: {
            mode: 'nearest',
            intersect: true,
            callbacks: {
              title: (items) => {
                if (!items.length) return '';
                const item = items[0];
                const tIndex = item.dataIndex;
                return allTournaments[tIndex].tournamentName;
              },
              label: (item) => `${item.dataset.label}: ${item.raw} pts`,
            }
          }
        },
        scales: {
          x: {
            ticks: { color: '#000' },
            grid: { color: '#eee' },
            title: { display: true, text: 'Tournament', color: '#555', font: { size: 11 } }
          },
          y: {
            beginAtZero: true,
            ticks: { color: '#000', stepSize: 1 },
            grid: { color: '#eee' },
            title: { display: true, text: 'Cumulative Points', color: '#555', font: { size: 11 } }
          }
        }
      }
    });
  }

  function showStandings() {
    const upToIndex = allTournaments.length - 1;

    const totals = {}, gameMap = {}, bonusMap = {}, gamesPlayedMap = {}, tournamentsMap = {};
    for (let i = 0; i <= upToIndex; i++) {
      for (const s of allTournaments[i].scores) {
        totals[s.deck]        = (totals[s.deck]        || 0) + s.total;
        gameMap[s.deck]       = (gameMap[s.deck]        || 0) + s.gamePoints;
        bonusMap[s.deck]      = (bonusMap[s.deck]       || 0) + s.bonusGroup + s.bonusFinalist + s.bonusWinner;
        tournamentsMap[s.deck]= (tournamentsMap[s.deck] || 0) + 1;
      }
      const tournament = allTournaments[i];
      const matchData = allMatches.find(m => m.id === tournament.tournamentId);
      if (matchData) {
        for (const round of matchData.rounds) {
          for (const match of round.matches) {
            const games = match.score1 + match.score2;
            gamesPlayedMap[match.player1] = (gamesPlayedMap[match.player1] || 0) + games;
            gamesPlayedMap[match.player2] = (gamesPlayedMap[match.player2] || 0) + games;
          }
        }
      }
    }

    currentSorted = Object.keys(totals)
      .map(deck => ({
        deck,
        total: totals[deck],
        game: gameMap[deck],
        bonus: bonusMap[deck],
        games: gamesPlayedMap[deck] || 0,
        ppg: gamesPlayedMap[deck] ? (totals[deck] / gamesPlayedMap[deck]) : 0,
        tournaments: tournamentsMap[deck] || 0,
        ppt: tournamentsMap[deck] ? (totals[deck] / tournamentsMap[deck]) : 0
      }))
      .sort((a, b) => b.total - a.total);

    sortKey = 'total';
    sortDir = -1;
    updateSortHeaders();
    renderTable(currentSorted);
  }

  function renderTable(data) {
    const tbody = document.getElementById('tbody');
    tbody.innerHTML = data.map((d, i) => {
      const rankClass = i < 3 ? `rank-${i+1}` : '';
      return `
        <tr>
          <td class="rank ${rankClass}">${i + 1}</td>
          <td>${d.deck}</td>
          <td class="sub-pts">${d.tournaments}</td>
          <td class="sub-pts">${d.games}</td>
          <td class="sub-pts">${d.game}</td>
          <td class="sub-pts">${d.bonus}</td>
          <td class="total-pts">${d.total}</td>
          <td class="sub-pts">${d.ppg.toFixed(2)}</td>
          <td class="sub-pts">${d.ppt.toFixed(2)}</td>
        </tr>
      `;
    }).join('');
  }

  function sortBy(key) {
    if (sortKey === key) {
      sortDir *= -1;
    } else {
      sortKey = key;
      sortDir = key === 'deck' ? 1 : -1;
    }
    currentSorted.sort((a, b) => {
      const av = a[key], bv = b[key];
      if (typeof av === 'string') return sortDir * av.localeCompare(bv);
      return sortDir * (bv - av);
    });
    updateSortHeaders();
    renderTable(currentSorted);
  }

  function updateSortHeaders() {
    const keyToIndex = { deck: 1, tournaments: 2, games: 3, game: 4, bonus: 5, total: 6, ppg: 7, ppt: 8 };
    document.querySelectorAll('th.sortable').forEach(th => {
      th.classList.remove('sort-asc', 'sort-desc');
    });
    const ths = document.querySelectorAll('th.sortable');
    const idx = Object.keys(keyToIndex).indexOf(sortKey);
    if (idx !== -1 && ths[idx]) {
      ths[idx].classList.add(sortDir === 1 ? 'sort-asc' : 'sort-desc');
    }
  }

  load().catch(e => {
    document.getElementById('error').textContent = 'Error loading data: ' + e.message;
  });
</script>
</body>
</html>
