<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Standings - Bobby Kelzor</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #fff;
      color: #000;
      min-height: 100vh;
      padding: 20px;
    }

    nav {
      display: flex;
      gap: 16px;
      margin-bottom: 28px;
    }

    nav a {
      color: #000;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.95rem;
    }

    nav a:hover { text-decoration: underline; }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 28px;
    }

    .selector {
      display: flex;
      gap: 8px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .selector-btn {
      background: #fff;
      border: 1.5px solid #000;
      color: #000;
      font-size: 0.85rem;
      font-weight: bold;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .selector-btn:hover { background: #f5f5f5; }

    .selector-btn.active {
      background: #000;
      color: #fff;
    }

    .chart-container {
      background: #fff;
      border: 1.5px solid #000;
      border-radius: 12px;
      padding: 24px;
      max-width: 800px;
      margin-bottom: 40px;
    }

    .chart-title {
      font-size: 0.8rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 16px;
      color: #555;
    }

    .leaderboard { max-width: 800px; }

    .leaderboard-title {
      font-size: 0.8rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
      color: #555;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      border: 1.5px solid #000;
    }

    th {
      background: #000;
      color: #fff;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 10px 16px;
      text-align: left;
    }

    th.sortable {
      cursor: pointer;
      user-select: none;
    }

    th.sortable:hover { background: #222; }

    th.sort-asc::after  { content: ' ▲'; font-size: 0.65rem; }
    th.sort-desc::after { content: ' ▼'; font-size: 0.65rem; }

    td {
      padding: 10px 16px;
      border-top: 1px solid #000;
      font-size: 0.95rem;
      color: #000;
    }

    tr:first-child td { border-top: none; }

    .rank { color: #555; font-size: 0.85rem; width: 32px; }
    .rank-1 { color: #000; font-weight: bold; }
    .rank-2 { color: #000; font-weight: bold; }
    .rank-3 { color: #000; font-weight: bold; }

    .total-pts { font-weight: bold; }
    .sub-pts { color: #555; font-size: 0.85rem; }

    #error { color: red; margin-top: 20px; }
  </style>
</head>
<body>

<nav>
  <a href="index.html">Home</a>
  <a href="tournament.html">Tournament</a>
  <a href="decks.html">Decks</a>
  <a href="standings.html">Standings</a>
  <a href="mvp.html">MVP</a>
  <a href="rules.html">Rules</a>
</nav>

<h1>Standings</h1>

<div id="selector" class="selector"></div>

<div class="chart-container">
  <div class="chart-title">Total Points by Deck</div>
  <canvas id="chart" height="100"></canvas>
</div>

<div class="leaderboard">
  <div class="leaderboard-title">Leaderboard</div>
  <table id="table">
    <thead>
      <tr>
        <th>#</th>
        <th class="sortable" onclick="sortBy('deck')">Deck</th>
        <th class="sortable" onclick="sortBy('games')">Games</th>
        <th class="sortable" onclick="sortBy('game')">Game Won</th>
        <th class="sortable" onclick="sortBy('bonus')">Bonus</th>
        <th class="sortable" onclick="sortBy('total')">Total</th>
        <th class="sortable" onclick="sortBy('ppg')">PPG</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<p id="error"></p>

<script>
  let allTournaments = [];
  let allMatches = [];
  let chartInstance = null;
  let currentSorted = [];
  let sortKey = 'total';
  let sortDir = -1; // -1 = desc, 1 = asc

  async function load() {
    const [pointsRes, matchesRes] = await Promise.all([
      fetch('data/points.json'),
      fetch('data/matches.json')
    ]);
    allTournaments = await pointsRes.json();
    allMatches = await matchesRes.json();

    const selector = document.getElementById('selector');
    selector.innerHTML = allTournaments.map((t, i) => `
      <button class="selector-btn ${i === allTournaments.length - 1 ? 'active' : ''}"
              onclick="showStandings(${i})"
              id="sbtn-${i}">
        After ${t.tournamentName}
      </button>
    `).join('');

    showStandings(allTournaments.length - 1);
  }

  function showStandings(upToIndex) {
    allTournaments.forEach((_, i) => {
      document.getElementById(`sbtn-${i}`).classList.toggle('active', i === upToIndex);
    });

    const totals = {}, gameMap = {}, bonusMap = {}, gamesPlayedMap = {};
    for (let i = 0; i <= upToIndex; i++) {
      for (const s of allTournaments[i].scores) {
        totals[s.deck]   = (totals[s.deck]   || 0) + s.total;
        gameMap[s.deck]  = (gameMap[s.deck]   || 0) + s.gamePoints;
        bonusMap[s.deck] = (bonusMap[s.deck]  || 0) + s.bonusFinalist + s.bonusWinner;
      }
      const tournament = allTournaments[i];
      const matchData = allMatches.find(m => m.id === tournament.tournamentId);
      if (matchData) {
        for (const round of matchData.rounds) {
          for (const match of round.matches) {
            const games = match.score1 + match.score2;
            gamesPlayedMap[match.player1] = (gamesPlayedMap[match.player1] || 0) + games;
            gamesPlayedMap[match.player2] = (gamesPlayedMap[match.player2] || 0) + games;
          }
        }
      }
    }

    currentSorted = Object.keys(totals)
      .map(deck => ({
        deck,
        total: totals[deck],
        game: gameMap[deck],
        bonus: bonusMap[deck],
        games: gamesPlayedMap[deck] || 0,
        ppg: gamesPlayedMap[deck] ? (totals[deck] / gamesPlayedMap[deck]) : 0
      }))
      .sort((a, b) => b.total - a.total);

    sortKey = 'total';
    sortDir = -1;
    updateSortHeaders();

    const sorted = currentSorted;

    if (chartInstance) chartInstance.destroy();
    chartInstance = new Chart(document.getElementById('chart'), {
      type: 'bar',
      data: {
        labels: sorted.map(d => d.deck),
        datasets: [
          {
            label: 'Game Won',
            data: sorted.map(d => d.game),
            backgroundColor: '#555',
            borderRadius: 4,
          },
          {
            label: 'Bonus Points',
            data: sorted.map(d => d.bonus),
            backgroundColor: '#000',
            borderRadius: 4,
          }
        ]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { labels: { color: '#000', font: { size: 12 } } },
          tooltip: {
            callbacks: {
              footer: (items) => 'Total: ' + items.reduce((s, i) => s + i.raw, 0)
            }
          }
        },
        scales: {
          x: { stacked: true, ticks: { color: '#000' }, grid: { color: '#eee' } },
          y: { stacked: true, ticks: { color: '#000', stepSize: 1 }, grid: { color: '#eee' }, beginAtZero: true }
        }
      }
    });

    renderTable(sorted);
  }

  function renderTable(data) {
    const tbody = document.getElementById('tbody');
    tbody.innerHTML = data.map((d, i) => {
      const rankClass = i < 3 ? `rank-${i+1}` : '';
      return `
        <tr>
          <td class="rank ${rankClass}">${i + 1}</td>
          <td>${d.deck}</td>
          <td class="sub-pts">${d.games}</td>
          <td class="sub-pts">${d.game}</td>
          <td class="sub-pts">${d.bonus}</td>
          <td class="total-pts">${d.total}</td>
          <td class="sub-pts">${d.ppg.toFixed(2)}</td>
        </tr>
      `;
    }).join('');
  }

  function sortBy(key) {
    if (sortKey === key) {
      sortDir *= -1;
    } else {
      sortKey = key;
      sortDir = key === 'deck' ? 1 : -1;
    }
    currentSorted.sort((a, b) => {
      const av = a[key], bv = b[key];
      if (typeof av === 'string') return sortDir * av.localeCompare(bv);
      return sortDir * (bv - av);
    });
    updateSortHeaders();
    renderTable(currentSorted);
  }

  function updateSortHeaders() {
    const keyToIndex = { deck: 1, games: 2, game: 3, bonus: 4, total: 5, ppg: 6 };
    document.querySelectorAll('th.sortable').forEach(th => {
      th.classList.remove('sort-asc', 'sort-desc');
    });
    const ths = document.querySelectorAll('th.sortable');
    const idx = Object.keys(keyToIndex).indexOf(sortKey);
    if (idx !== -1 && ths[idx]) {
      ths[idx].classList.add(sortDir === 1 ? 'sort-asc' : 'sort-desc');
    }
  }

  load().catch(e => {
    document.getElementById('error').textContent = 'Error loading data: ' + e.message;
  });
</script>
</body>
</html>
