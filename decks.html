<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Decks - Bobby Kelzor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #fff;
      color: #000;
      min-height: 100vh;
      padding: 20px;
    }

    .deck-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
      max-width: 800px;
    }

    .deck-card {
      background: #fff;
      border: 1.5px solid #000;
      border-radius: 10px;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .deck-name {
      font-size: 1.05rem;
      font-weight: bold;
      color: #000;
    }

    .colors {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .color-pip {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 1px solid #000;
    }

    .color-W { background: #f9fafb; }
    .color-U { background: #3b82f6; }
    .color-B { background: #1f2937; }
    .color-R { background: #ef4444; }
    .color-G { background: #22c55e; }

    /* Phones: three decks per row -- an iPhone SE is only 320px wide, so the
       card has to give up most of its padding and the pips shrink with it. */
    @media (max-width: 600px) {
      body { padding: 16px 10px; }

      .deck-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }

      .deck-card {
        padding: 10px 6px;
        gap: 6px;
        border-radius: 8px;
      }

      .deck-name { font-size: 0.75rem; }

      .colors { gap: 4px; }

      .color-pip {
        width: 14px;
        height: 14px;
      }
    }

    #error { color: red; margin-top: 20px; }
  </style>
  <script src="nav.js?v=2" defer></script>
</head>
<body>

<site-nav></site-nav>

<div id="deck-grid" class="deck-grid">
  <p style="color:#888">Loading...</p>
</div>
<p id="error"></p>

<script>
  async function load() {
    const res = await fetch('data/decks.json');
    const decks = await res.json();

    decks.sort((a, b) => (a.anzianita ?? Infinity) - (b.anzianita ?? Infinity));

    const grid = document.getElementById('deck-grid');
    grid.innerHTML = decks.map(deck => `
      <a class="deck-card" href="deck.html?id=${deck.id}" style="text-decoration:none;color:inherit;cursor:pointer">
        <div class="deck-name">${deck.name}${deck.is_dead ? ' <span style="font-size:1rem">✝</span>' : ''}</div>
        <div class="colors">
          ${deck.colors.map(c => `<div class="color-pip color-${c}"></div>`).join('')}
          ${deck.oldColors ? `<span style="color:#aaa;font-size:0.85rem;align-self:center">(</span>${deck.oldColors.map(c => `<div class="color-pip color-${c}"></div>`).join('')}<span style="color:#aaa;font-size:0.85rem;align-self:center">)</span>` : ''}
        </div>
      </a>
    `).join('');
  }

  load().catch(e => {
    document.getElementById('error').textContent = 'Error loading data: ' + e.message;
  });
</script>
</body>
</html>
