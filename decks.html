<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Decks - Bobby Kelzor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
    }

    nav {
      display: flex;
      gap: 16px;
      margin-bottom: 28px;
    }

    nav a {
      color: #a78bfa;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.95rem;
    }

    nav a:hover { text-decoration: underline; }

    h1 {
      color: #c4b5fd;
      font-size: 1.6rem;
      margin-bottom: 24px;
    }

    .deck-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
      max-width: 800px;
    }

    .deck-card {
      background: #16213e;
      border: 1px solid #2d2d5e;
      border-radius: 10px;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .deck-name {
      font-size: 1.05rem;
      font-weight: bold;
      color: #fff;
    }

    .colors {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .color-pip {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: bold;
      color: #000;
      flex-shrink: 0;
    }

    .color-W { background: #f9fafb; color: #555; border: 1px solid #ccc; }
    .color-U { background: #3b82f6; color: #fff; }
    .color-B { background: #374151; color: #fff; }
    .color-R { background: #ef4444; color: #fff; }
    .color-G { background: #22c55e; color: #fff; }

    #error {
      color: #f87171;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html">Home</a>
  <a href="tournament.html">Tournament</a>
  <a href="decks.html">Decks</a>
  <a href="standings.html">Standings</a>
</nav>

<h1>Decks</h1>

<div id="deck-grid" class="deck-grid">
  <p style="color:#888">Loading...</p>
</div>
<p id="error"></p>

<script>
  const COLOR_LABELS = { W: 'W', U: 'U', B: 'B', R: 'R', G: 'G' };

  async function load() {
    const res = await fetch('data/decks.json');
    const decks = await res.json();

    const grid = document.getElementById('deck-grid');
    grid.innerHTML = decks.map(deck => `
      <div class="deck-card">
        <div class="deck-name">${deck.name}</div>
        <div class="colors">
          ${deck.colors.map(c => `<div class="color-pip color-${c}">${COLOR_LABELS[c]}</div>`).join('')}
        </div>
      </div>
    `).join('');
  }

  load().catch(e => {
    document.getElementById('error').textContent = 'Error loading data: ' + e.message;
  });
</script>
</body>
</html>
